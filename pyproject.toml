[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autorecolor"
version = "0.1.0"
description = "AI-powered image recoloring via palette manipulation in OKLAB space"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Nitiz"},
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
autorecolor = "autoRecolor.cli:main"
autorecolor-server = "autoRecolor.server:main"

[tool.setuptools.packages.find]
where = ["src"]
