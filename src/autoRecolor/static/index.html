<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autoRecolor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ════════════════════════════════
   WARM DARK (default)
════════════════════════════════ */
:root, [data-theme="dark"] {
  --bg:         #1a1612;
  --topbar-bg:  #131109;
  --sidebar-bg: #16130e;
  --s1:         #1f1b15;
  --s2:         #272219;
  --s3:         #2e291f;
  --border:     #2e2820;
  --border2:    #3a3328;
  --text:       #f0e8dc;
  --text-mid:   #b8a99a;
  --text-dim:   #7a6e62;
  --user-bg:    #1f1b15;
  --user-br:    #3a3328;
  --preview-bg: #0e0c09;
  --scroll:     #2e2820;
  --shadow:     rgba(0,0,0,0.5);
  --think-hl:   #221d14;
  --ph-border:  #3a3328;
  --accent:     #d4724a;
  --accent2:    #e8926a;
  --accent-glow:rgba(212,114,74,0.12);
  --green:      #6ab187;
}

/* ════════════════════════════════
   WARM LIGHT
════════════════════════════════ */
[data-theme="light"] {
  --bg:         #f6f1ea;
  --topbar-bg:  #ede8e0;
  --sidebar-bg: #ede8e0;
  --s1:         #ffffff;
  --s2:         #f0ebe2;
  --s3:         #e6e0d6;
  --border:     #ddd7cc;
  --border2:    #ccc5b8;
  --text:       #1c1712;
  --text-mid:   #5a5044;
  --text-dim:   #8c7f70;
  --user-bg:    #ffffff;
  --user-br:    #ccc5b8;
  --preview-bg: #e0dbd2;
  --scroll:     #ccc5b8;
  --shadow:     rgba(0,0,0,0.1);
  --think-hl:   #f0ebe2;
  --ph-border:  #ccc5b8;
  --accent:     #c4622a;
  --accent2:    #a8501e;
  --accent-glow:rgba(196,98,42,0.1);
  --green:      #3a8a5a;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  font-size: 14px; line-height: 1.5;
  transition: background .2s, color .2s;
}
body { display: flex; flex-direction: column; overflow: hidden; }

@keyframes up     { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
@keyframes spin   { to{transform:rotate(360deg)} }
@keyframes shimmer{ 0%{background-position:-200% center} 100%{background-position:200% center} }

/* ════════════════════════════════
   TOPBAR (full width)
════════════════════════════════ */
.topbar {
  flex-shrink: 0; height: 50px; width: 100%;
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 18px;
  transition: background .2s, border-color .2s;
}
.brand { display: flex; align-items: center; gap: 8px; flex: 1; }
.brand-icon {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  background: linear-gradient(135deg, #c96040, #e88060);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -.1px; color: var(--text); }

.topbar-actions { display: flex; align-items: center; gap: 8px; }

.icon-btn {
  width: 30px; height: 30px; border-radius: 7px;
  border: 1px solid var(--border2); background: var(--s2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--text-mid);
  transition: background .15s, border-color .15s, color .15s;
}
.icon-btn:hover { background: var(--s3); color: var(--text); border-color: var(--border2); }

.upload-btn {
  height: 30px; padding: 0 14px; border-radius: 7px;
  background: var(--accent); color: #fff; border: none;
  font-size: 13px; font-weight: 500; cursor: pointer; letter-spacing: .1px;
  transition: opacity .15s, transform .1s;
}
.upload-btn:hover { opacity: .85; }
.upload-btn:active { transform: scale(.97); }
.upload-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

/* ════════════════════════════════
   PANELS ROW
════════════════════════════════ */
.panels { flex: 1; display: flex; overflow: hidden; }

/* ════════════════════════════════
   SIDEBAR
════════════════════════════════ */
.sidebar {
  flex: 1; min-width: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
  transition: background .2s, border-color .2s;
}

.preview-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 20px; overflow: hidden; position: relative;
  background: var(--preview-bg); cursor: pointer;
  transition: background .2s;
}
.preview-area img {
  max-width: 100%; max-height: 100%; object-fit: contain;
  border-radius: 6px; transition: opacity .2s;
  box-shadow: 0 4px 32px rgba(0,0,0,.5);
}
.preview-area img.loading { opacity: .3; }

.placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--text-dim); text-align: center; pointer-events: none; user-select: none;
}
.placeholder-icon {
  width: 52px; height: 52px; border-radius: 14px;
  border: 1.5px dashed var(--ph-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 6px;
}
.placeholder strong { color: var(--text-mid); font-size: 13px; font-weight: 500; display: block; }
.placeholder span { font-size: 12px; }

.drop-ring {
  position: absolute; inset: 10px; border: 2px dashed var(--accent);
  border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: var(--accent);
  background: var(--accent-glow);
}
body.dragging .drop-ring { opacity: 1; }

/* palette strip */
.palette-strip { flex-shrink: 0; border-top: 1px solid var(--border); overflow: hidden; }
.palette-strip img { display: block; width: 100%; height: 40px; }

/* swatches */
.palette-info {
  flex-shrink: 0; padding: 9px 12px 11px;
  border-top: 1px solid var(--border);
  display: flex; gap: 5px; flex-wrap: wrap;
  background: var(--sidebar-bg); transition: background .2s;
}
.swatch {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--s2); border: 1px solid var(--border2);
  padding: 3px 9px 3px 5px; border-radius: 20px;
  font-size: 11px; transition: background .15s;
}
.swatch:hover { background: var(--s3); }
.swatch .dot {
  width: 13px; height: 13px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.12); flex-shrink: 0;
}
.swatch .lbl { color: var(--text-dim); }
.swatch .hex { color: var(--text-mid); font-family: monospace; font-size: 10.5px; }
.swatch .pct { color: var(--text-dim); font-size: 10px; }

/* ════════════════════════════════
   MAIN CHAT
════════════════════════════════ */
.main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  height: 100%; background: var(--bg); transition: background .2s;
}

.messages-wrap {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
}
.messages-wrap::-webkit-scrollbar { width: 4px; }
.messages-wrap::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }

.messages {
  max-width: 700px; width: 100%; margin: 0 auto;
  padding: 28px 20px 8px;
  display: flex; flex-direction: column; gap: 2px;
  min-height: 100%;
}

/* empty state */
.messages:empty::after {
  content: 'Upload an image, then describe the recolor you want.';
  display: block; text-align: center;
  color: var(--text-dim); font-size: 13px;
  margin-top: 60px; line-height: 1.8;
}

/* ── rows ── */
.row {
  display: flex; gap: 10px; padding: 3px 0;
  animation: up .16s ease;
}
.row.user   { flex-direction: row-reverse; }
.row.system { justify-content: center; padding: 6px 0; }

/* avatar */
.av {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; margin-top: 2px; letter-spacing: -.3px;
  background: linear-gradient(135deg, #c96040, #e88060); color: #fff;
}
.row.user .av { background: var(--s3); color: var(--text-dim); }

/* bubble */
.bub {
  font-size: 13.5px; line-height: 1.65; color: var(--text);
  max-width: 580px;
}
.row.assistant .bub { padding: 4px 0; }
.row.user .bub {
  background: var(--user-bg); border: 1px solid var(--user-br);
  padding: 9px 14px; border-radius: 16px 3px 16px 16px;
}
.row.system .bub {
  font-size: 11px; color: var(--text-dim); padding: 0;
}

/* ── tool pill — inline chip, NOT full width ── */
.tool-row {
  padding: 2px 0 2px 36px;
  animation: up .16s ease;
}
.tool-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--s2); border: 1px solid var(--border2);
  padding: 2px 9px 2px 7px; border-radius: 20px;
  font-size: 11px; color: var(--text-dim);
}
.tool-chip::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.tool-chip span { color: var(--accent2); font-weight: 500; }

/* ── thinking block ── */
.think-row {
  padding: 3px 0 3px 36px;
  animation: up .16s ease;
}
details.think {
  display: inline-block; max-width: 580px; width: 100%;
}
details.think summary {
  list-style: none; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--text-dim);
  padding: 3px 10px 3px 8px;
  background: var(--s2); border: 1px solid var(--border2);
  border-radius: 20px; transition: border-color .15s;
}
details.think summary::-webkit-details-marker { display: none; }
details.think summary .arr { font-size: 7px; transition: transform .15s; flex-shrink: 0; }
details.think[open] summary .arr { transform: rotate(90deg); }
details.think summary:hover { border-color: var(--accent); }

/* shimmer while streaming */
details.think.streaming summary {
  border-color: rgba(212,114,74,.4);
  background: linear-gradient(90deg, var(--s2) 20%, var(--think-hl) 50%, var(--s2) 80%);
  background-size: 200% auto;
  animation: shimmer 1.4s linear infinite;
}

.think-body {
  margin-top: 6px; padding: 10px 13px;
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 11.5px; color: var(--text-dim); line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
  max-height: 220px; overflow-y: auto; font-family: monospace;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
}

/* ── typing indicator (dots in chat) ── */
@keyframes dot-bounce {
  0%,80%,100% { transform: translateY(0); opacity:.4; }
  40%          { transform: translateY(-5px); opacity:1; }
}
.typing-row {
  display: flex; gap: 10px; padding: 3px 0;
  animation: up .16s ease;
}
.typing-row .av {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; margin-top: 2px;
  background: linear-gradient(135deg, #c96040, #e88060); color: #fff;
}
.typing-dots {
  display: flex; align-items: center; gap: 4px; padding: 10px 4px;
}
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim);
  animation: dot-bounce 1.2s ease infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }

/* ── status bar ── */
.status-bar {
  max-width: 700px; width: 100%; margin: 0 auto;
  padding: 2px 20px 4px;
  font-size: 11.5px; color: var(--text-dim);
  min-height: 20px; display: flex; align-items: center; gap: 6px;
}
.status-bar.on { color: var(--accent2); }
.spinner {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid currentColor; border-top-color: transparent;
  animation: spin .65s linear infinite; flex-shrink: 0;
}

/* ── input area ── */
.input-area { padding: 0 20px 24px; flex-shrink: 0; }
.input-box {
  max-width: 700px; margin: 0 auto;
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 12px var(--shadow);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 2px 20px var(--shadow), 0 0 0 3px var(--accent-glow);
}
.input-box textarea {
  display: block; width: 100%; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 14px; line-height: 1.5; font-family: inherit;
  padding: 13px 15px 0; resize: none;
  min-height: 48px; max-height: 160px; overflow-y: auto;
}
.input-box textarea::placeholder { color: var(--text-dim); }
.input-box textarea:disabled { opacity: .4; cursor: not-allowed; }
.input-foot {
  display: flex; align-items: center; justify-content: flex-end; padding: 7px 8px;
}
.send-btn {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s, opacity .15s;
}
.send-btn:hover { opacity: .85; transform: scale(1.04); }
.send-btn:active { transform: scale(.95); }
.send-btn:disabled { background: var(--s3); opacity: .4; cursor: not-allowed; transform: none; }
.send-btn svg { width: 14px; height: 14px; }
/* stop state */
.send-btn.stop { background: #c0392b; }
.send-btn.stop:hover { opacity: .85; background: #e74c3c; }
.hint { max-width: 700px; margin: 6px auto 0; font-size: 11.5px; color: var(--text-dim); text-align: center; }

/* hidden compat */
#promptInput, #sendBtn { display: none; }

/* ════════════════════════════════
   RESPONSIVE
════════════════════════════════ */
@media (max-width: 680px)  {
  .panels { flex-direction: column; overflow: auto; }
  .sidebar { flex: none; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .preview-area { height: 40vh; }
  .main { min-height: 55vh; }
  .messages-wrap { overflow: visible; }
}
</style>
</head>
<body>

<!-- topbar -->
<div class="topbar">
  <div class="brand">
    <div class="brand-icon">🎨</div>
    <span class="brand-name">autoRecolor</span>
  </div>
  <div class="topbar-actions">
    <!-- model status -->
    <div style="display:flex;align-items:center;gap:5px;padding:0 6px;cursor:default" title="Model status">
      <span id="modelDot" style="width:7px;height:7px;border-radius:50%;background:#7a6e62;flex-shrink:0;transition:background .4s"></span>
      <span id="modelLbl" style="font-size:11.5px;color:var(--text-dim);white-space:nowrap">Checking…</span>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button class="upload-btn" id="uploadBtn">Upload image</button>
  </div>
</div>

<!-- panels -->
<div class="panels">

  <!-- sidebar -->
  <div class="sidebar">
    <div class="preview-area" id="previewArea" title="Click or drop an image">
      <div class="drop-ring">Drop image here</div>
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🖼️</div>
        <strong>No image loaded</strong>
        <span>Click or drop an image to get started</span>
      </div>
      <img id="previewImg" style="display:none" alt="Preview">
    </div>
    <div class="palette-strip" id="paletteStrip" style="display:none">
      <img id="paletteImg" alt="Palette">
    </div>
    <div class="palette-info" id="paletteInfo" style="display:none"></div>
  </div>

  <!-- main chat -->
  <div class="main">
    <div class="messages-wrap">
      <div class="messages" id="messages"></div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="textareaInput" placeholder="Describe the recolor you want…" disabled rows="1"></textarea>
        <div class="input-foot">
          <button class="send-btn" id="sendBtnReal" disabled title="Send (Enter)">
            <!-- send arrow -->
            <svg id="iconSend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
            <!-- stop square (hidden by default) -->
            <svg id="iconStop" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="hint" id="hint">Upload an image to begin</p>
    </div>

    <!-- hidden compat -->
    <input type="text" id="promptInput" disabled>
    <button id="sendBtn" disabled>Send</button>
  </div>

</div><!-- .panels -->

<script>
// ── refs ──────────────────────────────────────────────────
const FILE_INPUT    = document.getElementById('fileInput');
const UPLOAD_BTN    = document.getElementById('uploadBtn');
const PREVIEW_IMG   = document.getElementById('previewImg');
const PLACEHOLDER   = document.getElementById('placeholder');
const PALETTE_STRIP = document.getElementById('paletteStrip');
const PALETTE_IMG   = document.getElementById('paletteImg');
const PALETTE_INFO  = document.getElementById('paletteInfo');
const MESSAGES      = document.getElementById('messages');
const PROMPT_INPUT  = document.getElementById('promptInput');
const SEND_BTN      = document.getElementById('sendBtn');
const PREVIEW_AREA  = document.getElementById('previewArea');
const TEXTAREA      = document.getElementById('textareaInput');
const SEND_REAL     = document.getElementById('sendBtnReal');
const STATUS_BAR    = document.getElementById('statusBar');
const HINT          = document.getElementById('hint');
const THEME_BTN     = document.getElementById('themeBtn');

const ICON_SEND = document.getElementById('iconSend');
const ICON_STOP = document.getElementById('iconStop');

let sessionId = null, busy = false, activeSrc = null, typingRow = null;

// ── theme ─────────────────────────────────────────────────
let theme = localStorage.getItem('arc-theme') || 'dark';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  THEME_BTN.textContent = t === 'dark' ? '🌙' : '☀️';
  THEME_BTN.title = t === 'dark' ? 'Switch to light' : 'Switch to dark';
  localStorage.setItem('arc-theme', t);
}
applyTheme(theme);
THEME_BTN.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

// ── textarea auto-grow ────────────────────────────────────
TEXTAREA.addEventListener('input', () => {
  TEXTAREA.style.height = 'auto';
  TEXTAREA.style.height = Math.min(TEXTAREA.scrollHeight, 160) + 'px';
});

// ── wiring ───────────────────────────────────────────────
UPLOAD_BTN.addEventListener('click', () => FILE_INPUT.click());
PREVIEW_AREA.addEventListener('click', e => {
  if (!PREVIEW_IMG.style.display || PREVIEW_IMG.style.display === 'none'
      || e.target === PLACEHOLDER || PLACEHOLDER.contains(e.target)
      || e.target === PREVIEW_AREA)
    FILE_INPUT.click();
});
FILE_INPUT.addEventListener('change', uploadImage);
SEND_REAL.addEventListener('click', sendPrompt);
TEXTAREA.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});

// ── drag-and-drop ────────────────────────────────────────
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); document.body.classList.add('dragging');
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); document.body.classList.remove('dragging');
}));
document.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) {
    const dt = new DataTransfer(); dt.items.add(f);
    FILE_INPUT.files = dt.files; uploadImage();
  }
});

// ── upload ───────────────────────────────────────────────
async function uploadImage() {
  const file = FILE_INPUT.files[0];
  if (!file) return;
  setBusy(true, 'Analyzing…');
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    sessionId = data.session_id;
    updatePreview(data.preview_url, data.palette_strip_url, data.palette);
    sysMsg(file.name + ' loaded');
    TEXTAREA.disabled = false; SEND_REAL.disabled = false;
    HINT.textContent = 'What would you like to change?';
    TEXTAREA.focus();
  } catch (err) {
    sysMsg('Upload failed: ' + err.message);
    HINT.textContent = '';
  } finally { setBusy(false); }
}

// ── send ─────────────────────────────────────────────────
function sendPrompt() {
  // if busy, act as stop button
  if (busy) { stopStream(); return; }
  const text = TEXTAREA.value.trim();
  if (!text || !sessionId) return;
  TEXTAREA.value = ''; TEXTAREA.style.height = '';
  addMsg('user', text);
  showTyping();
  setBusy(true, 'Waiting for model…');
  stream(text);
}

function stopStream() {
  if (activeSrc) { activeSrc.close(); activeSrc = null; }
  removeTyping();
  setBusy(false);
  HINT.textContent = '';
  sysMsg('Stopped.');
}

// ── SSE ──────────────────────────────────────────────────
function stream(prompt) {
  const src = new EventSource(`/stream/${sessionId}?prompt=${encodeURIComponent(prompt)}`);
  activeSrc = src;

  // clear "waiting" state on the very first event of any kind
  let firstEvent = true;
  function onFirstEvent() {
    if (!firstEvent) return;
    firstEvent = false;
    removeTyping();
    STATUS_BAR.innerHTML = ''; STATUS_BAR.className = 'status-bar';
    // refresh model status — it's now definitely loaded
    checkModelStatus();
  }

  src.addEventListener('message', e => {
    onFirstEvent();
    try { const d = JSON.parse(e.data); if (d.text) addMsg('assistant', d.text); } catch(_) {}
  });

  let thinkRow = null, thinkEl = null;

  src.addEventListener('thinking', e => {
    onFirstEvent();
    const { chunk } = JSON.parse(e.data);
    if (!chunk) return;
    if (!thinkEl) {
      thinkRow = document.createElement('div');
      thinkRow.className = 'think-row';
      thinkEl = document.createElement('details');
      thinkEl.className = 'think streaming';
      thinkEl.open = true;
      thinkEl.innerHTML =
        '<summary><span class="arr">▶</span> Thinking…</summary>' +
        '<div class="think-body"></div>';
      thinkRow.appendChild(thinkEl);
      MESSAGES.appendChild(thinkRow);
    }
    thinkEl.querySelector('.think-body').textContent += chunk;
    scrollDown();
  });

  function sealThink() {
    if (thinkEl) {
      thinkEl.classList.remove('streaming');
      thinkEl.querySelector('summary').innerHTML = '<span class="arr">▶</span> Thinking';
    }
    thinkRow = thinkEl = null;
  }

  src.addEventListener('tool_call', e => {
    onFirstEvent();
    sealThink();
    const { name } = JSON.parse(e.data);
    const labels = { update_color:'set color', adjust_hsl:'adjust HSL',
      relabel_color:'relabel', get_palette:'view palette', finalize:'finalize' };
    const row = document.createElement('div');
    row.className = 'tool-row';
    row.innerHTML = `<span class="tool-chip"><span>${esc(labels[name] || name)}</span></span>`;
    MESSAGES.appendChild(row);
    scrollDown();
  });

  src.addEventListener('preview', e => {
    const d = JSON.parse(e.data);
    updatePreview(d.preview_url, d.palette_strip_url, d.palette);
  });

  src.addEventListener('finalize', e => {
    const { reasoning } = JSON.parse(e.data);
    addMsg('assistant', '✓ ' + reasoning);
  });

  src.addEventListener('done', () => {
    removeTyping(); sealThink();
    src.close(); activeSrc = null;
    setBusy(false); HINT.textContent = ''; TEXTAREA.focus();
  });

  src.addEventListener('error', e => {
    removeTyping();
    try { addMsg('system', 'Error: ' + JSON.parse(e.data).error); } catch(_) {}
    sealThink(); src.close(); activeSrc = null; setBusy(false); HINT.textContent = '';
  });

  src.onerror = () => {
    removeTyping(); sealThink();
    src.close(); activeSrc = null; setBusy(false); HINT.textContent = '';
  };
}

// ── helpers ──────────────────────────────────────────────
function updatePreview(previewUrl, stripUrl, palette) {
  if (previewUrl) {
    PREVIEW_IMG.src = previewUrl;
    PREVIEW_IMG.style.display = 'block';
    PLACEHOLDER.style.display = 'none';
    PREVIEW_IMG.classList.remove('loading');
  }
  if (stripUrl) { PALETTE_STRIP.style.display = 'block'; PALETTE_IMG.src = stripUrl; }
  if (palette) {
    PALETTE_INFO.style.display = 'flex';
    PALETTE_INFO.innerHTML = palette.palette.map(c =>
      `<span class="swatch">
        <span class="dot" style="background:${c.hex}"></span>
        <span class="lbl">${esc(c.label)}</span>
        <span class="hex"> ${c.hex}</span>
        <span class="pct"> ${c.pixel_percent}%</span>
      </span>`
    ).join('');
  }
}

function addMsg(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  if (role === 'system') {
    row.innerHTML = `<div class="bub">${esc(text)}</div>`;
  } else {
    const avTxt = role === 'user' ? 'You' : 'A';
    row.innerHTML = `<div class="av">${avTxt}</div><div class="bub">${esc(text)}</div>`;
  }
  MESSAGES.appendChild(row);
  scrollDown();
}

function sysMsg(text) { addMsg('system', text); }
function scrollDown() { MESSAGES.parentElement.scrollTop = MESSAGES.parentElement.scrollHeight; }

function setBusy(v, msg) {
  busy = v;
  UPLOAD_BTN.disabled = v;
  TEXTAREA.disabled = v || !sessionId;
  PROMPT_INPUT.disabled = v || !sessionId;
  SEND_BTN.disabled = false; // always enabled so it can act as stop
  // swap send ↔ stop icon
  if (v) {
    SEND_REAL.classList.add('stop');
    SEND_REAL.disabled = false;
    SEND_REAL.title = 'Stop';
    ICON_SEND.style.display = 'none';
    ICON_STOP.style.display = '';
  } else {
    SEND_REAL.classList.remove('stop');
    SEND_REAL.disabled = !sessionId;
    SEND_REAL.title = 'Send (Enter)';
    ICON_SEND.style.display = '';
    ICON_STOP.style.display = 'none';
  }
  if (v && msg) {
    STATUS_BAR.innerHTML = `<div class="spinner"></div>${esc(msg)}`;
    STATUS_BAR.className = 'status-bar on';
  } else {
    STATUS_BAR.innerHTML = ''; STATUS_BAR.className = 'status-bar';
  }
}

// ── typing indicator ──────────────────────────────────────
function showTyping() {
  if (typingRow) return;
  typingRow = document.createElement('div');
  typingRow.className = 'typing-row';
  typingRow.innerHTML =
    '<div class="av">A</div>' +
    '<div class="typing-dots"><span></span><span></span><span></span></div>';
  MESSAGES.appendChild(typingRow);
  scrollDown();
}
function removeTyping() {
  if (typingRow) { typingRow.remove(); typingRow = null; }
}

// ── model status indicator ────────────────────────────────
const MODEL_DOT = document.getElementById('modelDot');
const MODEL_LBL = document.getElementById('modelLbl');

async function checkModelStatus() {
  try {
    const r = await fetch('/model-status');
    const d = await r.json();
    if (d.loaded) {
      MODEL_DOT.style.background = '#6ab187';
      MODEL_LBL.textContent = 'Model ready';
      MODEL_LBL.title = d.model + ' is in VRAM';
    } else {
      MODEL_DOT.style.background = '#e07b45';
      MODEL_LBL.textContent = 'Model unloaded';
      MODEL_LBL.title = 'First prompt will load the model (~20s)';
    }
  } catch(_) {
    MODEL_DOT.style.background = '#7a6e62';
    MODEL_LBL.textContent = 'Ollama offline';
  }
}
checkModelStatus();
setInterval(checkModelStatus, 12000);

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
