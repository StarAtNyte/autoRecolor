<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autoRecolor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ════════════════════════════════
   COOL DARK (default) — magenta + lime accents
════════════════════════════════ */
:root, [data-theme="dark"] {
  --bg:          #0c0c14;
  --topbar-bg:   #08080f;
  --sidebar-bg:  #0e0e18;
  --s1:          #15151f;
  --s2:          #1c1c2a;
  --s3:          #262636;
  --border:      #1f1f2c;
  --border2:     #2e2e3f;
  --text:        #f4f3fb;
  --text-mid:    #aba8c4;
  --text-dim:    #6e6986;
  --text-faint:  #46425b;
  --user-bg:     linear-gradient(135deg, #1c1c2a, #15151f);
  --user-br:     #2e2e3f;
  --preview-bg:  #060610;
  --scroll:      #2e2e3f;
  --shadow:      rgba(0,0,0,.65);
  --think-hl:    #1e1e30;
  --ph-border:   #2e2e3f;
  /* magenta primary accent (OKLAB +a) */
  --accent:      #ff3da8;
  --accent2:     #ff80c8;
  --accent-deep: #c61c7e;
  --accent-glow: rgba(255,61,168,.18);
  --accent-soft: rgba(255,61,168,.08);
  /* lime — used for harmony/positive (OKLAB -a) */
  --green:       #b8ff45;
  --green-dim:   rgba(184,255,69,.14);
  /* secondary accents available for variety */
  --cyan:        #5be0e8;
  --gold:        #f3c44e;
  --chip-bg:     #1c1c2a;
  --card-bg:     #15151f;
  --bar-bg:      #262636;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

/* ════════════════════════════════
   WARM LIGHT
════════════════════════════════ */
[data-theme="light"] {
  --bg:          #f5f3ec;
  --topbar-bg:   #ebe7dc;
  --sidebar-bg:  #ebe7dc;
  --s1:          #ffffff;
  --s2:          #efebde;
  --s3:          #e3dccb;
  --border:      #d7d0bb;
  --border2:     #c3b89c;
  --text:        #1a1822;
  --text-mid:    #524e63;
  --text-dim:    #8a8597;
  --text-faint:  #b5b0c0;
  --user-bg:     #ffffff;
  --user-br:     #c3b89c;
  --preview-bg:  #e3dcca;
  --scroll:      #c3b89c;
  --shadow:      rgba(40,20,40,.12);
  --think-hl:    #efebde;
  --ph-border:   #c3b89c;
  --accent:      #d9248b;
  --accent2:     #ee5fb0;
  --accent-deep: #a01665;
  --accent-glow: rgba(217,36,139,.12);
  --accent-soft: rgba(217,36,139,.06);
  --green:       #7cba0a;
  --green-dim:   rgba(124,186,10,.16);
  --cyan:        #1d8b95;
  --gold:        #b8862c;
  --chip-bg:     #efebde;
  --card-bg:     #ffffff;
  --bar-bg:      #d7d0bb;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--sans);
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  transition: background .2s, color .2s;
}
body { display: flex; flex-direction: column; overflow: hidden; }

@keyframes up     { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
@keyframes spin   { to{transform:rotate(360deg)} }
@keyframes shimmer{ 0%{background-position:-200% center} 100%{background-position:200% center} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ════════════════════════════════
   TOPBAR
════════════════════════════════ */
.topbar {
  flex-shrink: 0; height: 50px; width: 100%;
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 0 16px;
  transition: background .2s, border-color .2s;
}
.brand { display: flex; align-items: center; gap: 12px; flex: 1; }
.brand-logo { width: 32px; height: 32px; flex-shrink: 0; }
.brand-name {
  display: inline-flex; align-items: baseline; gap: 1px;
  font-family: var(--sans); font-weight: 500;
  font-size: 17px; letter-spacing: -.3px; color: var(--text);
}
.brand-name .auto { color: var(--text-mid); font-weight: 400; }
.brand-name .recolor {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 22px;
  letter-spacing: -.5px;
  padding-right: 8px;
  margin-right: -6px;
  line-height: 1;
  background: linear-gradient(90deg, var(--accent) 0%, var(--green) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.topbar-actions { display: flex; align-items: center; gap: 6px; }

.icon-btn {
  height: 30px; padding: 0 10px; border-radius: 7px;
  border: 1px solid var(--border2); background: var(--s2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 5px; font-size: 12px; color: var(--text-mid);
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.icon-btn:hover { background: var(--s3); color: var(--text); border-color: var(--border2); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.icon-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

.icon-btn.active {
  background: var(--accent-glow); border-color: var(--accent);
  color: var(--accent2);
}

.upload-btn {
  height: 30px; padding: 0 12px; border-radius: 7px;
  background: var(--s2); color: var(--text-mid);
  border: 1px solid var(--border2);
  font-size: 12.5px; font-weight: 500; cursor: pointer; letter-spacing: .1px;
  display: flex; align-items: center; gap: 6px;
  transition: background .15s, color .15s, border-color .15s;
}
.upload-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.upload-btn:hover { background: var(--s3); color: var(--text); border-color: var(--border2); }
.upload-btn:active { transform: scale(.97); }
.upload-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

.divider { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }

/* ════════════════════════════════
   PANELS ROW
════════════════════════════════ */
.panels { flex: 1; display: flex; overflow: hidden; }

/* ════════════════════════════════
   SIDEBAR
════════════════════════════════ */
.sidebar {
  width: 480px; flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
  transition: background .2s, border-color .2s;
}

/* ── preview ── */
.preview-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 16px; overflow: hidden; position: relative;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,61,168,.06), transparent 50%),
    radial-gradient(circle at 85% 80%, rgba(184,255,69,.04), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(91,224,232,.03), transparent 60%),
    var(--preview-bg);
  cursor: pointer;
  transition: background .2s;
  min-height: 0;
}
.preview-area::before {
  content: "";
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  opacity: .6;
  z-index: 0;
}
.preview-area > * { position: relative; z-index: 1; }
.preview-area img {
  max-width: 100%; max-height: 100%; object-fit: contain;
  border-radius: 6px; transition: opacity .25s;
  box-shadow: 0 4px 32px rgba(0,0,0,.5);
}
.preview-area img.fading { opacity: 0; }

.placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--text-dim); text-align: center; pointer-events: none; user-select: none;
}
.placeholder-icon {
  width: 52px; height: 52px; border-radius: 14px;
  border: 1.5px dashed var(--ph-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 6px;
}
.placeholder strong { color: var(--text-mid); font-size: 13px; font-weight: 500; display: block; }
.placeholder span { font-size: 12px; }

.drop-ring {
  position: absolute; inset: 8px; border: 2px dashed var(--accent);
  border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: var(--accent);
  background: var(--accent-glow);
}
body.dragging .drop-ring { opacity: 1; }

/* compare badge */
.compare-label {
  position: absolute; top: 10px; left: 10px;
  font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; pointer-events: none;
  opacity: 0; transition: opacity .2s;
  background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(4px);
}
.compare-label.show { opacity: 1; }

/* preview download btn */
.preview-dl-btn {
  position: absolute; top: 10px; right: 10px;
  width: 30px; height: 30px; border-radius: 8px;
  background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.12); color: #fff;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
  z-index: 2;
}
.preview-dl-btn svg { width: 14px; height: 14px; }
.preview-dl-btn:hover { background: var(--accent); transform: scale(1.08); }
.preview-area:hover .preview-dl-btn { display: flex; }

.preview-new-btn {
  position: absolute; top: 10px; left: 10px;
  height: 28px; padding: 0 10px; border-radius: 8px;
  background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.85);
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 500;
  transition: background .15s, color .15s, transform .1s;
  z-index: 2;
}
.preview-new-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
.preview-new-btn:hover { background: rgba(0,0,0,.75); color: #fff; transform: scale(1.03); }
.preview-new-btn { display: flex; }

/* ── palette strip ── */
.palette-strip { flex-shrink: 0; border-top: 1px solid var(--border); overflow: hidden; }
.palette-strip img { display: block; width: 100%; height: 36px; }

/* ── palette section header ── */
.palette-header {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px 6px;
  border-top: 1px solid var(--border);
  background: var(--sidebar-bg); transition: background .2s;
}
.palette-header-lbl {
  font-size: 10.5px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  color: var(--text-dim);
}
.harmony-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; color: var(--text-dim);
}
.harmony-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--text-dim); transition: background .3s;
}
.harmony-dot.good   { background: var(--green); }
.harmony-dot.neutral { background: #f3c44e; }
.harmony-dot.low    { background: #ff6585; }

/* ── version history strip ── */
.history-strip {
  flex-shrink: 0; border-top: 1px solid var(--border);
  background: var(--sidebar-bg); transition: background .2s;
  display: flex; align-items: center; gap: 0;
  padding: 8px 6px; gap: 4px;
}
.hist-arrow {
  width: 24px; height: 56px; flex-shrink: 0; border-radius: 6px;
  border: 1px solid var(--border2); background: var(--s2);
  color: var(--text-dim); cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.hist-arrow:hover:not(:disabled) { background: var(--s3); color: var(--text); border-color: var(--accent); }
.hist-arrow:disabled { opacity: .25; cursor: default; }
.history-scroll {
  flex: 1; display: flex; gap: 5px; overflow-x: auto;
  scrollbar-width: none; padding: 0 2px;
}
.history-scroll::-webkit-scrollbar { display: none; }
.hist-thumb {
  flex-shrink: 0; width: 70px; height: 56px; border-radius: 6px;
  overflow: hidden; cursor: pointer; border: 2px solid transparent;
  transition: border-color .15s, transform .12s;
  position: relative; background: var(--preview-bg);
}
.hist-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hist-thumb:hover { transform: scale(1.04); border-color: var(--border2); }
.hist-thumb.active { border-color: var(--accent); }
.hist-thumb .hist-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.6); color: #fff; font-size: 8px;
  text-align: center; padding: 2px 0; line-height: 1.2;
}
.hist-dl {
  position: absolute; top: 3px; right: 3px;
  width: 18px; height: 18px; border-radius: 4px;
  background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  color: #fff; border: none; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .15s, background .15s;
}
.hist-dl svg { width: 10px; height: 10px; }
.hist-dl:hover { background: var(--accent); }
.hist-thumb:hover .hist-dl { opacity: 1; }

/* ── color cards ── */
.palette-cards {
  flex-shrink: 0; overflow-y: auto; max-height: 240px;
  padding: 4px 10px 10px;
  display: flex; flex-direction: column; gap: 4px;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
  background: var(--sidebar-bg); transition: background .2s;
}
.palette-cards::-webkit-scrollbar { width: 3px; }
.palette-cards::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }

.color-card {
  display: flex; align-items: center; gap: 9px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 9px;
  animation: up .16s ease;
  transition: background .15s, border-color .15s;
}
.color-card:hover { border-color: var(--border2); background: var(--s2); }

.cc-swatch {
  width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}

.cc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.cc-top {
  display: flex; align-items: baseline; gap: 5px;
}
.cc-hex {
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px;
  color: var(--text-dim); flex-shrink: 0;
}
.cc-pct {
  font-size: 10px; color: var(--text-dim); flex-shrink: 0;
  background: var(--bar-bg); padding: 1px 5px; border-radius: 4px;
}

.cc-bars { display: flex; align-items: center; gap: 8px; }

.cc-bar-group { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.cc-bar-lbl { font-size: 9px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); flex-shrink: 0; letter-spacing: .3px; }
.cc-bar {
  flex: 1; height: 3px; background: var(--bar-bg); border-radius: 2px; overflow: hidden;
}
.cc-bar-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .3s ease;
}
.cc-bar-val { font-size: 9px; color: var(--text-dim); flex-shrink: 0; font-family: monospace; }

.cc-chroma {
  flex-shrink: 0; font-size: 9px; font-weight: 600;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bar-bg); color: var(--text-dim);
  font-family: monospace;
}

/* ════════════════════════════════
   MAIN CHAT
════════════════════════════════ */
.main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  height: 100%; background: var(--bg); transition: background .2s;
}

.messages-wrap {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
}
.messages-wrap::-webkit-scrollbar { width: 4px; }
.messages-wrap::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }

.messages {
  max-width: 700px; width: 100%; margin: 0 auto;
  padding: 28px 20px 8px;
  display: flex; flex-direction: column; gap: 6px;
  min-height: 100%;
}

.messages:empty::after {
  content: 'Upload an image, then describe the recolor you want.';
  display: block; text-align: center;
  color: var(--text-dim); font-size: 13px;
  margin-top: 60px; line-height: 1.8;
}

/* ── session header (replaces dry sysMsg upload notice) ── */
.session-header {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 4px 0 14px;
  font-size: 11.5px; color: var(--text-dim);
  animation: up .16s ease;
}
.session-header .filename {
  font-family: var(--mono);
  color: var(--text-mid);
  max-width: 200px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-header .sep { color: var(--text-faint); }
.session-header .mini-strip {
  display: inline-flex; gap: 2px; padding: 2px;
  background: var(--s2); border: 1px solid var(--border);
  border-radius: 4px;
}
.session-header .mini-strip i {
  width: 12px; height: 12px; border-radius: 2px; display: inline-block;
}

/* ── suggestion chips ── */
.suggested {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 4px 0 6px 36px;
  margin-bottom: 8px;
  animation: up .2s ease;
}
.suggested .suggestion {
  font-size: 12.5px; color: var(--text-mid);
  background: linear-gradient(180deg, var(--s2), var(--s1));
  border: 1px solid var(--border);
  padding: 7px 13px;
  border-radius: 20px;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 7px;
  transition: border-color .15s, color .15s, transform .12s;
}
.suggested .suggestion::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); opacity: .6;
  transition: opacity .15s;
}
.suggested .suggestion:nth-child(4n+2)::before { background: var(--green); }
.suggested .suggestion:nth-child(4n+3)::before { background: var(--cyan); }
.suggested .suggestion:nth-child(4n+4)::before { background: var(--gold); }
.suggested .suggestion:hover {
  border-color: var(--border2); color: var(--text);
  transform: translateY(-1px);
}
.suggested .suggestion:hover::before { opacity: 1; }

/* ── canvas meta pill ── */
.canvas-meta {
  position: absolute; bottom: 12px; left: 12px;
  display: none; align-items: center; gap: 8px;
  background: rgba(8,8,16,.7); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.06);
  padding: 5px 11px 5px 9px; border-radius: 6px;
  font-family: var(--mono); font-size: 10.5px;
  color: rgba(255,255,255,.78); pointer-events: none; z-index: 2;
}
.canvas-meta.show { display: inline-flex; }
.canvas-meta .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px var(--green);
}

/* ── slider compare (drag-to-wipe) ── */
.preview-area.slider-mode { cursor: ew-resize; }
.compare-clip {
  position: absolute;
  inset: 0;  /* match preview-area exactly so handle pct and clip pct line up */
  pointer-events: none;
  display: none;
  z-index: 1;
  overflow: hidden;
}
.compare-clip img {
  position: absolute; inset: 16px;  /* same content box as the main img */
  width: calc(100% - 32px); height: calc(100% - 32px);
  object-fit: contain;
  display: block;
}
.preview-area.slider-mode .compare-clip { display: block; }
.compare-handle {
  position: absolute;
  top: 16px; bottom: 16px;
  width: 2px;
  background: rgba(255,255,255,.9);
  box-shadow: 0 0 14px rgba(0,0,0,.6);
  display: none;
  z-index: 4;
  pointer-events: none;
  transform: translateX(-1px);
}
.preview-area.slider-mode .compare-handle { display: block; }
.compare-handle::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
.compare-handle::before {
  content: "‹›";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  z-index: 2;
  font-family: var(--mono);
  font-size: 14px; font-weight: 700;
  color: #1c1714;
  letter-spacing: -1px;
}

/* ── mini palette swatches on chat thumb ── */
.chat-thumb-meta {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 8px 2px;
  font-size: 10.5px; color: var(--text-dim);
}
.chat-thumb-meta .v {
  font-family: var(--mono); color: var(--accent2); font-weight: 500;
}
.chat-thumb-meta .mini {
  display: inline-flex; gap: 2px;
}
.chat-thumb-meta .mini i {
  width: 10px; height: 10px; border-radius: 2px; display: inline-block;
}

/* ── rows ── */
.row {
  display: flex; gap: 10px; padding: 3px 0;
  animation: up .16s ease;
}
.row.user   { flex-direction: row-reverse; margin-top: 10px; }
.row.assistant { margin-top: 4px; }
.row.system { justify-content: center; padding: 6px 0; }

/* avatar */
.av {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center;
  background: #0a0a14; border: 1px solid var(--border2);
  overflow: hidden; margin-top: 2px;
}

/* bubble */
.bub {
  font-size: 13.5px; line-height: 1.65; color: var(--text);
  max-width: 580px;
}
.row.assistant .bub { padding: 4px 0; }
.row.user .bub {
  background: var(--user-bg); border: 1px solid var(--user-br);
  padding: 10px 15px; border-radius: 18px 6px 18px 18px;
  box-shadow: 0 1px 0 rgba(255,255,255,.03) inset;
}
.row.system .bub {
  font-size: 11px; color: var(--text-dim); padding: 0;
}

/* ── tool chip ── */
.tool-row {
  padding: 2px 0 2px 36px;
  animation: up .16s ease;
}
.tool-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--chip-bg); border: 1px solid var(--border2);
  padding: 2px 9px 2px 7px; border-radius: 20px;
  font-size: 11px; color: var(--text-dim);
}
.tool-chip::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.tool-chip span { color: var(--accent2); font-weight: 500; }

/* ── harmony rate chip ── */
.harmony-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--green-dim); border: 1px solid rgba(106,177,135,.3);
  padding: 2px 9px 2px 7px; border-radius: 20px;
  font-size: 11px; color: var(--green);
}
.harmony-chip::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
}

/* ── thinking block ── */
.think-row {
  padding: 3px 0 3px 36px;
  animation: up .16s ease;
}
details.think {
  display: inline-block; max-width: 580px; width: 100%;
}
details.think summary {
  list-style: none; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--text-dim);
  padding: 3px 10px 3px 8px;
  background: var(--s2); border: 1px solid var(--border2);
  border-radius: 20px; transition: border-color .15s;
}
details.think summary::-webkit-details-marker { display: none; }
details.think summary .arr { font-size: 7px; transition: transform .15s; flex-shrink: 0; }
details.think[open] summary .arr { transform: rotate(90deg); }
details.think summary:hover { border-color: var(--accent); }

details.think.streaming summary {
  border-color: rgba(255,61,168,.45);
  background: linear-gradient(90deg, var(--s2) 20%, var(--think-hl) 50%, var(--s2) 80%);
  background-size: 200% auto;
  animation: shimmer 1.4s linear infinite;
}

.think-body {
  margin-top: 6px; padding: 10px 13px;
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 11.5px; color: var(--text-dim); line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
  max-height: 220px; overflow-y: auto; font-family: monospace;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
}

/* ── inline chat thumbnail ── */
.chat-thumb-row {
  padding: 4px 0 4px 36px;
  animation: up .18s ease;
}
.chat-thumb {
  width: 220px;
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border2); cursor: pointer;
  transition: border-color .15s, transform .12s;
  background: var(--s1); display: flex; flex-direction: column;
}
.chat-thumb .img-frame {
  width: 100%; height: 140px;
  background: var(--preview-bg);
  display: block; overflow: hidden;
}
.chat-thumb .img-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.chat-thumb:hover { border-color: var(--accent); transform: scale(1.02); }

/* ── typing indicator ── */
@keyframes dot-bounce {
  0%,80%,100% { transform: translateY(0); opacity:.4; }
  40%          { transform: translateY(-5px); opacity:1; }
}
.typing-row {
  display: flex; gap: 10px; padding: 3px 0;
  animation: up .16s ease;
}
.typing-row .av {
  /* inherits from .av — square + brand mark */
}
.typing-dots {
  display: flex; align-items: center; gap: 4px; padding: 10px 4px;
}
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim);
  animation: dot-bounce 1.2s ease infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }

/* ── status bar ── */
.status-bar {
  max-width: 700px; width: 100%; margin: 0 auto;
  padding: 2px 20px 4px;
  font-size: 11.5px; color: var(--text-dim);
  min-height: 20px; display: flex; align-items: center; gap: 6px;
}
.status-bar.on { color: var(--accent2); }
.spinner {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid currentColor; border-top-color: transparent;
  animation: spin .65s linear infinite; flex-shrink: 0;
}

/* ── input area ── */
.input-area { padding: 0 20px 20px; flex-shrink: 0; }
.input-box {
  max-width: 700px; margin: 0 auto;
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 12px var(--shadow);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 2px 20px var(--shadow), 0 0 0 3px var(--accent-glow);
}
.input-box textarea {
  display: block; width: 100%; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 14px; line-height: 1.5; font-family: inherit;
  padding: 13px 15px 0; resize: none;
  min-height: 48px; max-height: 160px; overflow-y: auto;
}
.input-box textarea::placeholder { color: var(--text-dim); }
.input-box textarea:disabled { opacity: .4; cursor: not-allowed; }
.input-foot {
  display: flex; align-items: center; justify-content: space-between; padding: 7px 8px;
}
.think-toggle {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-dim); cursor: pointer;
  padding: 4px 9px; border-radius: 7px; border: 1px solid transparent;
  background: none; font-family: inherit; transition: all .15s; user-select: none;
}
.think-toggle:hover { border-color: var(--border2); color: var(--text); }
.think-toggle.active { color: var(--accent2); border-color: var(--accent); background: var(--accent-glow); }
.think-toggle svg { width: 12px; height: 12px; flex-shrink: 0; }
.model-tag {
  font-family: var(--mono); font-size: 11px; color: var(--text-faint);
  user-select: none;
}
.send-btn {
  width: 32px; height: 32px; border-radius: 9px; border: none;
  background: linear-gradient(135deg, #ff3da8 0%, #c61c7e 100%);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 14px rgba(255,61,168,.4), inset 0 1px 0 rgba(255,255,255,.2);
  transition: filter .15s, transform .1s, opacity .15s;
}
.send-btn:hover:not(:disabled) { filter: brightness(1.08); transform: scale(1.05); }
.send-btn:active { transform: scale(.95); }
.send-btn:disabled { background: var(--s3); opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.send-btn svg { width: 14px; height: 14px; }
.send-btn.stop { background: #c61c7e; }
.send-btn.stop:hover { opacity: .85; background: #ff3da8; }
.hint { max-width: 700px; margin: 5px auto 0; font-size: 11.5px; color: var(--text-dim); text-align: center; }

/* hidden compat */
#promptInput, #sendBtn { display: none; }

/* ════════════════════════════════
   RESPONSIVE
════════════════════════════════ */
@media (max-width: 740px) {
  .sidebar { width: 100%; flex-shrink: 0; border-right: none; border-bottom: 1px solid var(--border); }
  .panels { flex-direction: column; overflow: auto; }
  .preview-area { height: 38vh; }
  .palette-cards { max-height: 160px; }
  .main { min-height: 50vh; }
  .messages-wrap { overflow: visible; }

}
</style>
</head>
<body>

<script>
// ── refs ──────────────────────────────────────────────────
const FILE_INPUT    = document.getElementById('fileInput');
const UPLOAD_BTN    = document.getElementById('uploadBtn');
const PREVIEW_IMG   = document.getElementById('previewImg');
const PLACEHOLDER   = document.getElementById('placeholder');
const PALETTE_STRIP = document.getElementById('paletteStrip');
const PALETTE_IMG   = document.getElementById('paletteImg');
const PALETTE_CARDS = document.getElementById('paletteCards');
const PALETTE_HDR   = document.getElementById('paletteHeader');
const MESSAGES      = document.getElementById('messages');
const PROMPT_INPUT  = document.getElementById('promptInput');
const SEND_BTN      = document.getElementById('sendBtn');
const PREVIEW_AREA  = document.getElementById('previewArea');
const TEXTAREA      = document.getElementById('textareaInput');
const SEND_REAL     = document.getElementById('sendBtnReal');
const STATUS_BAR    = document.getElementById('statusBar');
const HINT          = document.getElementById('hint');
const THEME_BTN     = document.getElementById('themeBtn');
const COMPARE_BTN   = document.getElementById('compareBtn');
const DOWNLOAD_BTN  = document.getElementById('downloadBtn');
const THINK_BTN     = document.getElementById('thinkBtn');
const COMPOSER_MODEL_TAG = document.getElementById('composerModelTag');

let thinkMode = true;
THINK_BTN.addEventListener('click', () => {
  thinkMode = !thinkMode;
  THINK_BTN.classList.toggle('active', thinkMode);
  THINK_BTN.title = thinkMode
    ? 'Reasoning ON — slower but more accurate'
    : 'Reasoning OFF — faster responses';
  // model tag reflects current mode
  COMPOSER_MODEL_TAG.textContent = thinkMode ? 'qwen3.6:27b · think' : 'qwen3.6:27b';
});
const COMPARE_LBL   = document.getElementById('compareLabel');
const PREVIEW_NEW_BTN = document.getElementById('previewNewBtn');
PREVIEW_NEW_BTN.addEventListener('click', e => { e.stopPropagation(); FILE_INPUT.click(); });

const PREVIEW_DL_BTN = document.getElementById('previewDlBtn');
PREVIEW_DL_BTN.addEventListener('click', e => {
  e.stopPropagation();
  const url = comparingOriginal ? originalPreviewUrl : (currentPreviewUrl || originalPreviewUrl);
  if (!url) return;
  const label = comparingOriginal ? 'original' : 'recolored';
  const a = document.createElement('a');
  a.href = url; a.download = `autorecolor-${label}.png`; a.click();
});
const HARMONY_DOT   = document.getElementById('harmonyDot');
const HARMONY_LBL   = document.getElementById('harmonyLbl');
const ICON_SEND     = document.getElementById('iconSend');
const ICON_STOP     = document.getElementById('iconStop');

let sessionId = null, busy = false, activeSrc = null, typingRow = null;
let originalPreviewUrl = null;   // first upload preview (for compare)
let currentPreviewUrl  = null;   // latest recolored preview
let comparingOriginal  = false;

// ── version history ────────────────────────────────────────
const HISTORY_STRIP  = document.getElementById('historyStrip');
const HISTORY_SCROLL = document.getElementById('historyScroll');
const HIST_PREV      = document.getElementById('histPrev');
const HIST_NEXT      = document.getElementById('histNext');

let imageHistory = [];   // [{previewUrl, paletteStripUrl, palette, label}]
let historyIdx   = -1;   // which version is active in the main preview

function pushHistory(previewUrl, paletteStripUrl, palette, label) {
  // If we're mid-history (user navigated back), trim future entries
  imageHistory = imageHistory.slice(0, historyIdx + 1);
  imageHistory.push({ previewUrl, paletteStripUrl, palette, label });
  historyIdx = imageHistory.length - 1;
  renderHistoryStrip();
}

function renderHistoryStrip() {
  if (imageHistory.length <= 1) { HISTORY_STRIP.style.display = 'none'; return; }
  HISTORY_STRIP.style.display = 'flex';
  HISTORY_SCROLL.innerHTML = '';
  imageHistory.forEach((entry, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'hist-thumb' + (i === historyIdx ? ' active' : '');
    thumb.title = entry.label;
    thumb.innerHTML = `<img src="${entry.previewUrl}" alt="v${i+1}">
      <div class="hist-label">${entry.label}</div>
      <button class="hist-dl" title="Download ${entry.label}">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v8M5 7l3 3 3-3"/><path d="M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/>
        </svg>
      </button>`;
    thumb.addEventListener('click', () => navigateHistory(i));
    // download button — stop propagation so it doesn't also navigate
    thumb.querySelector('.hist-dl').addEventListener('click', e => {
      e.stopPropagation();
      const a = document.createElement('a');
      a.href = entry.previewUrl;
      a.download = `autorecolor-${entry.label}.png`;
      a.click();
    });
    HISTORY_SCROLL.appendChild(thumb);
  });
  // scroll active thumb into view
  const active = HISTORY_SCROLL.children[historyIdx];
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  HIST_PREV.disabled = historyIdx <= 0;
  HIST_NEXT.disabled = historyIdx >= imageHistory.length - 1;
}

function navigateHistory(idx) {
  if (idx < 0 || idx >= imageHistory.length) return;
  historyIdx = idx;
  const entry = imageHistory[idx];
  // update main preview without touching currentPreviewUrl (which stays latest)
  setPreviewImg(entry.previewUrl, true);
  if (entry.paletteStripUrl) { PALETTE_STRIP.style.display = ''; PALETTE_IMG.src = entry.paletteStripUrl; }

// ── auto-load default image on startup ───────────────────
async function loadDefault() {
  setBusy(true, 'Loading sample…');
  try {
    const res = await fetch('/load-default', { method: 'POST' });
    if (!res.ok) throw new Error('No default image');
    const data = await res.json();
    sessionId = data.session_id;
    originalPreviewUrl = data.preview_url;
    currentPreviewUrl  = data.preview_url;
    updatePreview(data.preview_url, data.palette_strip_url, data.palette);
    pushHistory(data.preview_url, data.palette_strip_url, data.palette, 'original');
    COMPARE_BTN.disabled = false;
    DOWNLOAD_BTN.disabled = false;
    renderSessionStart(data.filename, data.palette.palette);
    updateCanvasMetaFromImage();
    TEXTAREA.disabled = false; SEND_REAL.disabled = false;
    HINT.textContent = 'What would you like to change?';
  } catch (err) {
    // No default — show normal empty state
    PLACEHOLDER.querySelector('strong').textContent = 'No image loaded';
    PLACEHOLDER.querySelector('span').textContent = 'Click or drop an image to get started';
  } finally { setBusy(false); }
}
loadDefault();

// ── upload ───────────────────────────────────────────────
async function uploadImage() {
  const file = FILE_INPUT.files[0];
  if (!file) return;
  setBusy(true, 'Analyzing…');
  // reset compare + history state
  comparingOriginal = false;
  setSliderActive(false);
  CANVAS_META.classList.remove('show');
  originalPreviewUrl = null;
  currentPreviewUrl = null;
  imageHistory = []; historyIdx = -1;
  HISTORY_STRIP.style.display = 'none';
  HISTORY_SCROLL.innerHTML = '';
  COMPARE_BTN.disabled = true;
  DOWNLOAD_BTN.disabled = true;
  COMPARE_BTN.classList.remove('active');

  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    sessionId = data.session_id;
    originalPreviewUrl = data.preview_url;
    currentPreviewUrl  = data.preview_url;
    updatePreview(data.preview_url, data.palette_strip_url, data.palette);
    pushHistory(data.preview_url, data.palette_strip_url, data.palette, 'original');
    COMPARE_BTN.disabled = false;
    DOWNLOAD_BTN.disabled = false;
    renderSessionStart(file.name, data.palette.palette);
    updateCanvasMetaFromImage();
    TEXTAREA.disabled = false; SEND_REAL.disabled = false;
    HINT.textContent = 'What would you like to change?';
    TEXTAREA.focus();
  } catch (err) {
    sysMsg('Upload failed: ' + err.message);
    HINT.textContent = '';
  } finally { setBusy(false); }
}

// ── send ─────────────────────────────────────────────────
function sendPrompt() {
  if (busy) { stopStream(); return; }
  const text = TEXTAREA.value.trim();
  if (!text || !sessionId) return;
  hideSuggestions();
  TEXTAREA.value = ''; TEXTAREA.style.height = '';
  addMsg('user', text);
  showTyping();
  setBusy(true, 'Waiting for model…');
  stream(text);
}

function stopStream() {
  if (activeSrc) { activeSrc.close(); activeSrc = null; }
  removeTyping();
  setBusy(false);
  HINT.textContent = '';
  sysMsg('Stopped.');
}

// ── SSE ──────────────────────────────────────────────────
const TOOL_LABELS = {
  get_palette:     'view palette',
  update_color:    'set color',
  adjust_color:    'adjust color',
  adjust_palette:  'adjust palette',
  set_lightness:   'set lightness',
  set_chroma:      'set chroma',
  match_lightness: 'match lightness',
  rate_palette:    'rate harmony',
  relabel_color:   'relabel',
  finalize:        'finalize',
  // legacy
  adjust_hsl:      'adjust HSL',
};

function stream(prompt) {
  const url = `/stream/${sessionId}?prompt=${encodeURIComponent(prompt)}&think=${thinkMode}`;
  const src = new EventSource(url);
  activeSrc = src;

  let firstEvent = true;
  function onFirstEvent() {
    if (!firstEvent) return;
    firstEvent = false;
    removeTyping();
    STATUS_BAR.innerHTML = ''; STATUS_BAR.className = 'status-bar';
  }

  src.addEventListener('message', e => {
    onFirstEvent();
    try { const d = JSON.parse(e.data); if (d.text) addMsg('assistant', d.text); } catch(_) {}
  });

  let thinkRow = null, thinkEl = null;

  src.addEventListener('thinking', e => {
    onFirstEvent();
    const { chunk } = JSON.parse(e.data);
    if (!chunk) return;
    if (!thinkEl) {
      thinkRow = document.createElement('div');
      thinkRow.className = 'think-row';
      thinkEl = document.createElement('details');
      thinkEl.className = 'think streaming';
      thinkEl.open = false;
      thinkEl.innerHTML =
        '<summary><span class="arr">▶</span> Reasoning…</summary>' +
        '<div class="think-body"></div>';
      thinkRow.appendChild(thinkEl);
      MESSAGES.appendChild(thinkRow);
    }
    thinkEl.querySelector('.think-body').textContent += chunk;
    scrollDown();
  });

  function sealThink() {
    if (thinkEl) {
      thinkEl.classList.remove('streaming');
      thinkEl.querySelector('summary').innerHTML = '<span class="arr">▶</span> Reasoning';
    }
    thinkRow = thinkEl = null;
  }

  src.addEventListener('tool_call', e => {
    onFirstEvent();
    sealThink();
    const { name } = JSON.parse(e.data);
    const label = TOOL_LABELS[name] || name;
    const isHarmony = name === 'rate_palette';
    const row = document.createElement('div');
    row.className = 'tool-row';
    row.innerHTML = `<span class="${isHarmony ? 'harmony-chip' : 'tool-chip'}"><span>${esc(label)}</span></span>`;
    MESSAGES.appendChild(row);
    scrollDown();
  });

  let previewCount = 0;
  src.addEventListener('preview', e => {
    const d = JSON.parse(e.data);
    if (!d.preview_url) return;
    currentPreviewUrl = d.preview_url;
    previewCount++;

    // push to version history
    const vLabel = 'v' + (imageHistory.length);
    pushHistory(d.preview_url, d.palette_strip_url, d.palette, vLabel);

    // show main preview (unless user is comparing original)
    if (!comparingOriginal) updatePreview(d.preview_url, d.palette_strip_url, d.palette);
    else if (d.palette) updatePaletteOnly(d.palette);

    // inline chat thumbnail
    const thumbRow = document.createElement('div');
    thumbRow.className = 'chat-thumb-row';
    const thumbLink = document.createElement('div');
    thumbLink.className = 'chat-thumb';
    thumbLink.title = 'Click to view this version';
    const miniSwatches = (d.palette && d.palette.palette)
      ? d.palette.palette.slice(0, 6).map(c => `<i style="background:${c.hex}"></i>`).join('')
      : '';
    const harmonyScore = (d.palette && typeof d.palette.harmony_score === 'number')
      ? (d.palette.harmony_score >= 0 ? '+' : '') + d.palette.harmony_score.toFixed(2)
      : '';
    thumbLink.innerHTML =
      `<div class="img-frame"><img src="${d.preview_url}" alt="${vLabel}"></div>` +
      `<div class="chat-thumb-meta">` +
        `<span class="v">${esc(vLabel)}</span>` +
        `<span class="mini">${miniSwatches}</span>` +
        (harmonyScore ? `<span style="font-family:var(--mono);font-size:10px;color:var(--text-dim)">harmony ${harmonyScore}</span>` : '') +
      `</div>`;
    thumbLink.addEventListener('click', () => {
      const idx = imageHistory.findIndex(h => h.previewUrl === d.preview_url);
      if (idx >= 0) navigateHistory(idx);
    });
    thumbRow.appendChild(thumbLink);
    MESSAGES.appendChild(thumbRow);
    scrollDown();
  });

  src.addEventListener('finalize', e => {
    const { reasoning } = JSON.parse(e.data);
    addMsg('assistant', '✓ ' + reasoning);
  });

  src.addEventListener('done', () => {
    removeTyping(); sealThink();
    src.close(); activeSrc = null;
    setBusy(false); HINT.textContent = ''; TEXTAREA.focus();
  });

  src.addEventListener('error', e => {
    removeTyping();
    try { addMsg('system', 'Error: ' + JSON.parse(e.data).error); } catch(_) {}
    sealThink(); src.close(); activeSrc = null; setBusy(false); HINT.textContent = '';
  });

  src.onerror = () => {
    removeTyping(); sealThink();
    src.close(); activeSrc = null; setBusy(false); HINT.textContent = '';
  };
}

// ── preview helpers ───────────────────────────────────────
function setPreviewImg(url, fade = true) {
  if (!url) return;
  if (fade) {
    PREVIEW_IMG.classList.add('fading');
    setTimeout(() => {
      PREVIEW_IMG.src = url;
      PREVIEW_IMG.classList.remove('fading');
    }, 200);
  } else {
    PREVIEW_IMG.src = url;
  }
}

function updatePreview(previewUrl, stripUrl, palette) {
  if (previewUrl) {
    setPreviewImg(previewUrl, !!PREVIEW_IMG.src && PREVIEW_IMG.style.display !== 'none');
    PREVIEW_IMG.style.display = 'block';
    PLACEHOLDER.style.display = 'none';
  }
  if (stripUrl) { PALETTE_STRIP.style.display = 'block'; PALETTE_IMG.src = stripUrl; }
  if (palette)  updatePaletteOnly(palette);
}

function updatePaletteOnly(palette) {
  PALETTE_HDR.style.display = 'flex';
  PALETTE_CARDS.style.display = 'flex';

  // Update harmony badge
  const score = palette.harmony_score ?? 0;
  const interp = score > 0.2 ? 'good' : score > -0.2 ? 'neutral' : 'low';
  HARMONY_DOT.className = 'harmony-dot ' + interp;
  HARMONY_LBL.textContent = 'Harmony ' + (score >= 0 ? '+' : '') + score.toFixed(3);

  // Render color cards
  PALETTE_CARDS.innerHTML = palette.palette.map(c => {
    const oklab = c.oklab || [0, 0, 0];
    const L = oklab[0] ?? 0;
    const chroma = c.chroma ?? 0;
    const hueAngle = c.hue_angle ?? 0;
    const Lpct = Math.round(L * 100);
    // Chroma bar: max chroma ~0.4, scale to %
    const Cpct = Math.min(100, Math.round(chroma / 0.4 * 100));
    // Pick bar fill color based on hue angle for visual flair
    const hue = Math.round(hueAngle);

    return `<div class="color-card">
      <div class="cc-swatch" style="background:${c.hex};border-color:rgba(255,255,255,${L > 0.6 ? '.15' : '.08'})"></div>
      <div class="cc-info">
        <div class="cc-top">
          <span class="cc-hex">${esc(c.hex)}</span>
          <span class="cc-pct">${c.pixel_percent}%</span>
        </div>
        <div class="cc-bars">
          <div class="cc-bar-group">
            <span class="cc-bar-lbl">L</span>
            <div class="cc-bar"><div class="cc-bar-fill" style="width:${Lpct}%;background:linear-gradient(90deg,${c.hex}99,${c.hex})"></div></div>
            <span class="cc-bar-val">${L.toFixed(2)}</span>
          </div>
          <span class="cc-chroma" title="chroma ${chroma.toFixed(3)}, hue ${hueAngle}°">C ${chroma.toFixed(2)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function addMsg(role, text) {
  const row = document.createElement('div');

  if (role === 'system') {
    row.innerHTML = `<div class="bub">${esc(text)}</div>`;
  } else if (role === 'user') {

  } else {
    row.innerHTML = `<div class="av">${SVG_MINIMARK}</div><div class="bub">${esc(text)}</div>`;

function sysMsg(text) { addMsg('system', text); }

function setBusy(v, msg) {

// ── session header + suggestion chips ─────────────────────
const SUGGESTIONS = [
  "make the whole image green",
  "go full vintage desaturated",
  "darker and more contrasty",
  "shift everything toward teal",
];

function renderSessionStart(filename, paletteColors) {
  // Remove any existing session header / suggestions
  document.querySelectorAll('.session-header, .suggested').forEach(el => el.remove());

  const header = document.createElement('div');
  header.className = 'session-header';
  const miniHTML = paletteColors.slice(0, 6).map(c =>
    `<i style="background:${c.hex}" title="${esc(c.label)} · ${esc(c.hex)}"></i>`
  ).join('');
  header.innerHTML =
    `<span class="filename" title="${esc(filename)}">${esc(filename)}</span>` +
    `<span class="sep">·</span>` +
    `<span>${paletteColors.length} colors extracted</span>` +
    `<span class="sep">·</span>` +
    `<span class="mini-strip">${miniHTML}</span>`;
  MESSAGES.appendChild(header);

  // Suggestion chips
  const sug = document.createElement('div');
  sug.className = 'suggested';
  sug.innerHTML = SUGGESTIONS.map(s =>
    `<button class="suggestion">${esc(s)}</button>`
  ).join('');
  sug.querySelectorAll('.suggestion').forEach(btn => {
    btn.addEventListener('click', () => {
      const txt = btn.textContent.trim();
      hideSuggestions();
      TEXTAREA.value = txt;
      TEXTAREA.style.height = 'auto';
      TEXTAREA.style.height = Math.min(TEXTAREA.scrollHeight, 160) + 'px';
      sendPrompt();
    });
  });
  MESSAGES.appendChild(sug);
  scrollDown();
}

function hideSuggestions() {
  document.querySelectorAll('.suggested').forEach(el => el.remove());
}

const COMPARE_CLIP     = document.getElementById('compareClip');
const COMPARE_CLIP_IMG = document.getElementById('compareClipImg');
const COMPARE_HANDLE   = document.getElementById('compareHandle');
let sliderActive = false;
function setSliderActive(on) {
  sliderActive = on;
  PREVIEW_AREA.classList.toggle('slider-mode', on);
  COMPARE_BTN.classList.toggle('active', on);
  if (on) {

function esc(s) {

}

// ── model status ──────────────────────────────────────────
const MODEL_DOT = document.getElementById('modelDot');
const MODEL_LBL = document.getElementById('modelLbl');

let modelLoaded = false;
let modelPollInterval = null;

function setModelState(state, label, title) {
  const colors = { ready: '#b8ff45', loading: '#f3c44e', offline: '#ff6585', unknown: 'var(--text-dim)' };
  MODEL_DOT.style.background = colors[state] || colors.unknown;
  MODEL_DOT.style.boxShadow = state === 'ready' ? '0 0 8px rgba(184,255,69,.5)' : 'none';
  MODEL_LBL.textContent = label;
  MODEL_LBL.title = title || '';
  // pulse animation while loading
  MODEL_DOT.style.animation = state === 'loading' ? 'pulse 1.2s ease-in-out infinite' : 'none';
}

async function checkModelStatus() {
  try {
    const r = await fetch('/model-status');
    const d = await r.json();
    if (d.loaded) {
      modelLoaded = true;
      setModelState('ready', 'Model ready', d.model + ' is in VRAM');
      // slow down polling once loaded
      if (modelPollInterval) { clearInterval(modelPollInterval); modelPollInterval = setInterval(checkModelStatus, 20000); }
    } else {
      setModelState('loading', 'Model loading…', 'Loading ' + d.model + ' into VRAM');
    }
  } catch(_) {
    setModelState('offline', 'Ollama offline', 'Cannot reach Ollama at localhost:11434');
    if (modelPollInterval) { clearInterval(modelPollInterval); modelPollInterval = setInterval(checkModelStatus, 20000); }
  }
}

async function startPreload() {
  try {
    const r = await fetch('/model-status');
    const d = await r.json();
    if (d.loaded) {
      modelLoaded = true;
      setModelState('ready', 'Model ready', d.model + ' is in VRAM');
      modelPollInterval = setInterval(checkModelStatus, 20000);
    } else {
      // trigger preload, then poll fast until loaded
      setModelState('loading', 'Model loading…', 'Warming up model — ready in ~30s');
      fetch('/preload', { method: 'POST' }).catch(() => {});
      modelPollInterval = setInterval(checkModelStatus, 3000);
    }
  } catch(_) {
    setModelState('offline', 'Ollama offline', 'Cannot reach Ollama at localhost:11434');
    modelPollInterval = setInterval(checkModelStatus, 20000);
  }
