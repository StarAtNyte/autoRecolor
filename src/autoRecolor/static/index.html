<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autoRecolor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ════════════════════════════════
   WARM DARK (default)
════════════════════════════════ */
:root, [data-theme="dark"] {
  --bg:          #191613;
  --topbar-bg:   #111009;
  --sidebar-bg:  #15120d;
  --s1:          #1e1a14;
  --s2:          #252019;
  --s3:          #2c2720;
  --border:      #2c2720;
  --border2:     #38322a;
  --text:        #f0e8dc;
  --text-mid:    #b8a99a;
  --text-dim:    #7a6e62;
  --user-bg:     #1e1a14;
  --user-br:     #38322a;
  --preview-bg:  #0d0b09;
  --scroll:      #2c2720;
  --shadow:      rgba(0,0,0,.55);
  --think-hl:    #201c13;
  --ph-border:   #38322a;
  --accent:      #d4724a;
  --accent2:     #e8926a;
  --accent-glow: rgba(212,114,74,.14);
  --green:       #6ab187;
  --green-dim:   rgba(106,177,135,.15);
  --chip-bg:     #1e1a14;
  --card-bg:     #1e1a14;
  --bar-bg:      #2c2720;
}

/* ════════════════════════════════
   WARM LIGHT
════════════════════════════════ */
[data-theme="light"] {
  --bg:          #f5f0e8;
  --topbar-bg:   #ede8df;
  --sidebar-bg:  #ede8df;
  --s1:          #ffffff;
  --s2:          #f0ebe2;
  --s3:          #e6e0d6;
  --border:      #ddd7cc;
  --border2:     #ccc5b8;
  --text:        #1c1712;
  --text-mid:    #5a5044;
  --text-dim:    #8c7f70;
  --user-bg:     #ffffff;
  --user-br:     #ccc5b8;
  --preview-bg:  #e0dbd2;
  --scroll:      #ccc5b8;
  --shadow:      rgba(0,0,0,.1);
  --think-hl:    #f0ebe2;
  --ph-border:   #ccc5b8;
  --accent:      #c4622a;
  --accent2:     #a8501e;
  --accent-glow: rgba(196,98,42,.1);
  --green:       #3a8a5a;
  --green-dim:   rgba(58,138,90,.12);
  --chip-bg:     #f0ebe2;
  --card-bg:     #ffffff;
  --bar-bg:      #ddd7cc;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  font-size: 14px; line-height: 1.5;
  transition: background .2s, color .2s;
}
body { display: flex; flex-direction: column; overflow: hidden; }

@keyframes up     { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
@keyframes spin   { to{transform:rotate(360deg)} }
@keyframes shimmer{ 0%{background-position:-200% center} 100%{background-position:200% center} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ════════════════════════════════
   TOPBAR
════════════════════════════════ */
.topbar {
  flex-shrink: 0; height: 50px; width: 100%;
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 0 16px;
  transition: background .2s, border-color .2s;
}
.brand { display: flex; align-items: center; gap: 8px; flex: 1; }
.brand-icon {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  background: linear-gradient(135deg, #c96040, #e88060);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -.1px; color: var(--text); }
.brand-tag {
  font-size: 10px; font-weight: 500; letter-spacing: .4px; text-transform: uppercase;
  color: var(--text-dim); background: var(--s2); border: 1px solid var(--border2);
  padding: 1px 6px; border-radius: 4px;
}

.topbar-actions { display: flex; align-items: center; gap: 6px; }

.icon-btn {
  height: 30px; padding: 0 10px; border-radius: 7px;
  border: 1px solid var(--border2); background: var(--s2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 5px; font-size: 12px; color: var(--text-mid);
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.icon-btn:hover { background: var(--s3); color: var(--text); border-color: var(--border2); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.icon-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

.icon-btn.active {
  background: var(--accent-glow); border-color: var(--accent);
  color: var(--accent2);
}

.upload-btn {
  height: 30px; padding: 0 14px; border-radius: 7px;
  background: var(--accent); color: #fff; border: none;
  font-size: 13px; font-weight: 500; cursor: pointer; letter-spacing: .1px;
  transition: opacity .15s, transform .1s;
}
.upload-btn:hover { opacity: .85; }
.upload-btn:active { transform: scale(.97); }
.upload-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

.divider { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }

/* ════════════════════════════════
   PANELS ROW
════════════════════════════════ */
.panels { flex: 1; display: flex; overflow: hidden; }

/* ════════════════════════════════
   SIDEBAR
════════════════════════════════ */
.sidebar {
  width: 480px; flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
  transition: background .2s, border-color .2s;
}

/* ── preview ── */
.preview-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 16px; overflow: hidden; position: relative;
  background: var(--preview-bg); cursor: pointer;
  transition: background .2s;
  min-height: 0;
}
.preview-area img {
  max-width: 100%; max-height: 100%; object-fit: contain;
  border-radius: 6px; transition: opacity .25s;
  box-shadow: 0 4px 32px rgba(0,0,0,.5);
}
.preview-area img.fading { opacity: 0; }

.placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--text-dim); text-align: center; pointer-events: none; user-select: none;
}
.placeholder-icon {
  width: 52px; height: 52px; border-radius: 14px;
  border: 1.5px dashed var(--ph-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 6px;
}
.placeholder strong { color: var(--text-mid); font-size: 13px; font-weight: 500; display: block; }
.placeholder span { font-size: 12px; }

.drop-ring {
  position: absolute; inset: 8px; border: 2px dashed var(--accent);
  border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: var(--accent);
  background: var(--accent-glow);
}
body.dragging .drop-ring { opacity: 1; }

/* compare badge */
.compare-label {
  position: absolute; top: 10px; left: 10px;
  font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; pointer-events: none;
  opacity: 0; transition: opacity .2s;
  background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(4px);
}
.compare-label.show { opacity: 1; }

/* ── palette strip ── */
.palette-strip { flex-shrink: 0; border-top: 1px solid var(--border); overflow: hidden; }
.palette-strip img { display: block; width: 100%; height: 36px; }

/* ── palette section header ── */
.palette-header {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px 6px;
  border-top: 1px solid var(--border);
  background: var(--sidebar-bg); transition: background .2s;
}
.palette-header-lbl {
  font-size: 10.5px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  color: var(--text-dim);
}
.harmony-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; color: var(--text-dim);
}
.harmony-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--text-dim); transition: background .3s;
}
.harmony-dot.good   { background: var(--green); }
.harmony-dot.neutral { background: #c4a84a; }
.harmony-dot.low    { background: #c06060; }

/* ── color cards ── */
.palette-cards {
  flex-shrink: 0; overflow-y: auto; max-height: 240px;
  padding: 4px 10px 10px;
  display: flex; flex-direction: column; gap: 4px;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
  background: var(--sidebar-bg); transition: background .2s;
}
.palette-cards::-webkit-scrollbar { width: 3px; }
.palette-cards::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }

.color-card {
  display: flex; align-items: center; gap: 9px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 9px;
  animation: up .16s ease;
  transition: background .15s, border-color .15s;
}
.color-card:hover { border-color: var(--border2); background: var(--s2); }

.cc-swatch {
  width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}

.cc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.cc-top {
  display: flex; align-items: baseline; gap: 5px;
}
.cc-label {
  font-size: 12px; font-weight: 500; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}
.cc-hex {
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px;
  color: var(--text-dim); flex-shrink: 0;
}
.cc-pct {
  font-size: 10px; color: var(--text-dim); flex-shrink: 0;
  background: var(--bar-bg); padding: 1px 5px; border-radius: 4px;
}

.cc-bars { display: flex; align-items: center; gap: 8px; }

.cc-bar-group { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.cc-bar-lbl { font-size: 9px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); flex-shrink: 0; letter-spacing: .3px; }
.cc-bar {
  flex: 1; height: 3px; background: var(--bar-bg); border-radius: 2px; overflow: hidden;
}
.cc-bar-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .3s ease;
}
.cc-bar-val { font-size: 9px; color: var(--text-dim); flex-shrink: 0; font-family: monospace; }

.cc-chroma {
  flex-shrink: 0; font-size: 9px; font-weight: 600;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bar-bg); color: var(--text-dim);
  font-family: monospace;
}

/* ════════════════════════════════
   MAIN CHAT
════════════════════════════════ */
.main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  height: 100%; background: var(--bg); transition: background .2s;
}

.messages-wrap {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
}
.messages-wrap::-webkit-scrollbar { width: 4px; }
.messages-wrap::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }

.messages {
  max-width: 700px; width: 100%; margin: 0 auto;
  padding: 28px 20px 8px;
  display: flex; flex-direction: column; gap: 2px;
  min-height: 100%;
}

.messages:empty::after {
  content: 'Upload an image, then describe the recolor you want.';
  display: block; text-align: center;
  color: var(--text-dim); font-size: 13px;
  margin-top: 60px; line-height: 1.8;
}

/* ── rows ── */
.row {
  display: flex; gap: 10px; padding: 3px 0;
  animation: up .16s ease;
}
.row.user   { flex-direction: row-reverse; }
.row.system { justify-content: center; padding: 6px 0; }

/* avatar */
.av {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; margin-top: 2px; letter-spacing: -.3px;
  background: linear-gradient(135deg, #c96040, #e88060); color: #fff;
}
.row.user .av { background: var(--s3); color: var(--text-dim); }

/* bubble */
.bub {
  font-size: 13.5px; line-height: 1.65; color: var(--text);
  max-width: 580px;
}
.row.assistant .bub { padding: 4px 0; }
.row.user .bub {
  background: var(--user-bg); border: 1px solid var(--user-br);
  padding: 9px 14px; border-radius: 16px 3px 16px 16px;
}
.row.system .bub {
  font-size: 11px; color: var(--text-dim); padding: 0;
}

/* ── tool chip ── */
.tool-row {
  padding: 2px 0 2px 36px;
  animation: up .16s ease;
}
.tool-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--chip-bg); border: 1px solid var(--border2);
  padding: 2px 9px 2px 7px; border-radius: 20px;
  font-size: 11px; color: var(--text-dim);
}
.tool-chip::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.tool-chip span { color: var(--accent2); font-weight: 500; }

/* ── harmony rate chip ── */
.harmony-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--green-dim); border: 1px solid rgba(106,177,135,.3);
  padding: 2px 9px 2px 7px; border-radius: 20px;
  font-size: 11px; color: var(--green);
}
.harmony-chip::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
}

/* ── thinking block ── */
.think-row {
  padding: 3px 0 3px 36px;
  animation: up .16s ease;
}
details.think {
  display: inline-block; max-width: 580px; width: 100%;
}
details.think summary {
  list-style: none; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--text-dim);
  padding: 3px 10px 3px 8px;
  background: var(--s2); border: 1px solid var(--border2);
  border-radius: 20px; transition: border-color .15s;
}
details.think summary::-webkit-details-marker { display: none; }
details.think summary .arr { font-size: 7px; transition: transform .15s; flex-shrink: 0; }
details.think[open] summary .arr { transform: rotate(90deg); }
details.think summary:hover { border-color: var(--accent); }

details.think.streaming summary {
  border-color: rgba(212,114,74,.4);
  background: linear-gradient(90deg, var(--s2) 20%, var(--think-hl) 50%, var(--s2) 80%);
  background-size: 200% auto;
  animation: shimmer 1.4s linear infinite;
}

.think-body {
  margin-top: 6px; padding: 10px 13px;
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 11.5px; color: var(--text-dim); line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
  max-height: 220px; overflow-y: auto; font-family: monospace;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
}

/* ── typing indicator ── */
@keyframes dot-bounce {
  0%,80%,100% { transform: translateY(0); opacity:.4; }
  40%          { transform: translateY(-5px); opacity:1; }
}
.typing-row {
  display: flex; gap: 10px; padding: 3px 0;
  animation: up .16s ease;
}
.typing-row .av {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; margin-top: 2px;
  background: linear-gradient(135deg, #c96040, #e88060); color: #fff;
}
.typing-dots {
  display: flex; align-items: center; gap: 4px; padding: 10px 4px;
}
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim);
  animation: dot-bounce 1.2s ease infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }

/* ── status bar ── */
.status-bar {
  max-width: 700px; width: 100%; margin: 0 auto;
  padding: 2px 20px 4px;
  font-size: 11.5px; color: var(--text-dim);
  min-height: 20px; display: flex; align-items: center; gap: 6px;
}
.status-bar.on { color: var(--accent2); }
.spinner {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid currentColor; border-top-color: transparent;
  animation: spin .65s linear infinite; flex-shrink: 0;
}

/* ── input area ── */
.input-area { padding: 0 20px 20px; flex-shrink: 0; }
.input-box {
  max-width: 700px; margin: 0 auto;
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 12px var(--shadow);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 2px 20px var(--shadow), 0 0 0 3px var(--accent-glow);
}
.input-box textarea {
  display: block; width: 100%; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 14px; line-height: 1.5; font-family: inherit;
  padding: 13px 15px 0; resize: none;
  min-height: 48px; max-height: 160px; overflow-y: auto;
}
.input-box textarea::placeholder { color: var(--text-dim); }
.input-box textarea:disabled { opacity: .4; cursor: not-allowed; }
.input-foot {
  display: flex; align-items: center; justify-content: space-between; padding: 7px 8px;
}
.think-toggle {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-dim); cursor: pointer;
  padding: 3px 7px; border-radius: 6px; border: 1px solid transparent;
  background: none; font-family: inherit; transition: all .15s; user-select: none;
}
.think-toggle:hover { border-color: var(--border2); color: var(--text); }
.think-toggle.active { color: var(--accent2); border-color: var(--accent); background: var(--accent-glow); }
.think-toggle svg { width: 12px; height: 12px; flex-shrink: 0; }
.send-btn {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s, opacity .15s;
}
.send-btn:hover { opacity: .85; transform: scale(1.04); }
.send-btn:active { transform: scale(.95); }
.send-btn:disabled { background: var(--s3); opacity: .4; cursor: not-allowed; transform: none; }
.send-btn svg { width: 14px; height: 14px; }
.send-btn.stop { background: #c0392b; }
.send-btn.stop:hover { opacity: .85; background: #e74c3c; }
.hint { max-width: 700px; margin: 5px auto 0; font-size: 11.5px; color: var(--text-dim); text-align: center; }

/* hidden compat */
#promptInput, #sendBtn { display: none; }

/* ════════════════════════════════
   RESPONSIVE
════════════════════════════════ */
@media (max-width: 740px) {
  .sidebar { width: 100%; flex-shrink: 0; border-right: none; border-bottom: 1px solid var(--border); }
  .panels { flex-direction: column; overflow: auto; }
  .preview-area { height: 38vh; }
  .palette-cards { max-height: 160px; }
  .main { min-height: 50vh; }
  .messages-wrap { overflow: visible; }
  .brand-tag { display: none; }
}
</style>
</head>
<body>

<!-- topbar -->
<div class="topbar">
  <div class="brand">
    <div class="brand-icon">🎨</div>
    <span class="brand-name">autoRecolor</span>
    <span class="brand-tag">OKLAB</span>
  </div>
  <div class="topbar-actions">
    <!-- model status -->
    <div id="modelStatus" style="display:flex;align-items:center;gap:5px;padding:0 6px;cursor:default;user-select:none" title="Ollama model status">
      <span id="modelDot" style="width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex-shrink:0;transition:background .4s"></span>
      <span id="modelLbl" style="font-size:11.5px;color:var(--text-dim);white-space:nowrap">Checking…</span>
    </div>
    <div class="divider"></div>
    <!-- before/after compare -->
    <button class="icon-btn" id="compareBtn" disabled title="Toggle before/after">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <rect x="1" y="3" width="6" height="10" rx="1"/><rect x="9" y="3" width="6" height="10" rx="1"/>
        <line x1="8" y1="1" x2="8" y2="15"/>
      </svg>
      Compare
    </button>
    <!-- download -->
    <button class="icon-btn" id="downloadBtn" disabled title="Download recolored image">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v8M5 7l3 3 3-3"/><path d="M2 11v1a2 2 0 002 2h8a2 2 0 002-2v-1"/>
      </svg>
      Save
    </button>
    <div class="divider"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" style="padding:0;width:30px;">🌙</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button class="upload-btn" id="uploadBtn">Upload image</button>
  </div>
</div>

<!-- panels -->
<div class="panels">

  <!-- sidebar -->
  <div class="sidebar">
    <div class="preview-area" id="previewArea" title="Click or drop an image">
      <div class="drop-ring">Drop image here</div>
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🖼️</div>
        <strong>No image loaded</strong>
        <span>Click or drop an image to get started</span>
      </div>
      <img id="previewImg" style="display:none" alt="Preview">
      <div class="compare-label" id="compareLabel">ORIGINAL</div>
    </div>

    <div class="palette-strip" id="paletteStrip" style="display:none">
      <img id="paletteImg" alt="Palette">
    </div>

    <div class="palette-header" id="paletteHeader" style="display:none">
      <span class="palette-header-lbl">Palette</span>
      <div class="harmony-badge">
        <div class="harmony-dot" id="harmonyDot"></div>
        <span id="harmonyLbl" style="font-size:10.5px;">—</span>
      </div>
    </div>

    <div class="palette-cards" id="paletteCards" style="display:none"></div>
  </div>

  <!-- main chat -->
  <div class="main">
    <div class="messages-wrap">
      <div class="messages" id="messages"></div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="textareaInput" placeholder="Describe the recolor you want…" disabled rows="1"></textarea>
        <div class="input-foot">
          <button class="think-toggle active" id="thinkBtn" title="Thinking ON — model reasons before acting">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2a5 5 0 014 8l-.4.4V13a1 1 0 01-1 1H5.4a1 1 0 01-1-1v-2.6L4 10A5 5 0 018 2z"/>
              <line x1="6" y1="12.5" x2="10" y2="12.5"/>
            </svg>
            Think
          </button>
          <button class="send-btn" id="sendBtnReal" disabled title="Send (Enter)">
            <svg id="iconSend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
            <svg id="iconStop" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="hint" id="hint">Upload an image to begin</p>
    </div>

    <!-- hidden compat -->
    <input type="text" id="promptInput" disabled>
    <button id="sendBtn" disabled>Send</button>
  </div>

</div><!-- .panels -->

<script>
// ── refs ──────────────────────────────────────────────────
const FILE_INPUT    = document.getElementById('fileInput');
const UPLOAD_BTN    = document.getElementById('uploadBtn');
const PREVIEW_IMG   = document.getElementById('previewImg');
const PLACEHOLDER   = document.getElementById('placeholder');
const PALETTE_STRIP = document.getElementById('paletteStrip');
const PALETTE_IMG   = document.getElementById('paletteImg');
const PALETTE_CARDS = document.getElementById('paletteCards');
const PALETTE_HDR   = document.getElementById('paletteHeader');
const MESSAGES      = document.getElementById('messages');
const PROMPT_INPUT  = document.getElementById('promptInput');
const SEND_BTN      = document.getElementById('sendBtn');
const PREVIEW_AREA  = document.getElementById('previewArea');
const TEXTAREA      = document.getElementById('textareaInput');
const SEND_REAL     = document.getElementById('sendBtnReal');
const STATUS_BAR    = document.getElementById('statusBar');
const HINT          = document.getElementById('hint');
const THEME_BTN     = document.getElementById('themeBtn');
const COMPARE_BTN   = document.getElementById('compareBtn');
const DOWNLOAD_BTN  = document.getElementById('downloadBtn');
const THINK_BTN     = document.getElementById('thinkBtn');

let thinkMode = true;
THINK_BTN.addEventListener('click', () => {
  thinkMode = !thinkMode;
  THINK_BTN.classList.toggle('active', thinkMode);
  THINK_BTN.title = thinkMode
    ? 'Thinking ON — slower but more accurate'
    : 'Thinking OFF — faster responses';
});
const COMPARE_LBL   = document.getElementById('compareLabel');
const HARMONY_DOT   = document.getElementById('harmonyDot');
const HARMONY_LBL   = document.getElementById('harmonyLbl');
const ICON_SEND     = document.getElementById('iconSend');
const ICON_STOP     = document.getElementById('iconStop');

let sessionId = null, busy = false, activeSrc = null, typingRow = null;
let originalPreviewUrl = null;   // first upload preview (for compare)
let currentPreviewUrl  = null;   // latest recolored preview
let comparingOriginal  = false;

// ── theme ─────────────────────────────────────────────────
let theme = localStorage.getItem('arc-theme') || 'dark';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  THEME_BTN.textContent = t === 'dark' ? '🌙' : '☀️';
  THEME_BTN.title = t === 'dark' ? 'Switch to light' : 'Switch to dark';
  localStorage.setItem('arc-theme', t);
}
applyTheme(theme);
THEME_BTN.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

// ── textarea auto-grow ────────────────────────────────────
TEXTAREA.addEventListener('input', () => {
  TEXTAREA.style.height = 'auto';
  TEXTAREA.style.height = Math.min(TEXTAREA.scrollHeight, 160) + 'px';
});

// ── wiring ───────────────────────────────────────────────
UPLOAD_BTN.addEventListener('click', () => FILE_INPUT.click());
PREVIEW_AREA.addEventListener('click', e => {
  if (!PREVIEW_IMG.style.display || PREVIEW_IMG.style.display === 'none'
      || e.target === PLACEHOLDER || PLACEHOLDER.contains(e.target)
      || e.target === PREVIEW_AREA)
    FILE_INPUT.click();
});
FILE_INPUT.addEventListener('change', uploadImage);
SEND_REAL.addEventListener('click', sendPrompt);
TEXTAREA.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});

// ── compare (before/after) ────────────────────────────────
COMPARE_BTN.addEventListener('click', () => {
  if (!originalPreviewUrl || !currentPreviewUrl) return;
  comparingOriginal = !comparingOriginal;
  COMPARE_BTN.classList.toggle('active', comparingOriginal);
  COMPARE_LBL.textContent = comparingOriginal ? 'ORIGINAL' : 'RECOLORED';
  setPreviewImg(comparingOriginal ? originalPreviewUrl : currentPreviewUrl, false);
  COMPARE_LBL.classList.toggle('show', true);
  clearTimeout(COMPARE_LBL._t);
  COMPARE_LBL._t = setTimeout(() => COMPARE_LBL.classList.remove('show'), 1400);
});

// ── download ─────────────────────────────────────────────
DOWNLOAD_BTN.addEventListener('click', () => {
  const url = currentPreviewUrl || originalPreviewUrl;
  if (!url) return;
  const a = document.createElement('a');
  a.href = url;
  a.download = 'recolored.png';
  a.click();
});

// ── drag-and-drop ────────────────────────────────────────
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); document.body.classList.add('dragging');
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); document.body.classList.remove('dragging');
}));
document.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) {
    const dt = new DataTransfer(); dt.items.add(f);
    FILE_INPUT.files = dt.files; uploadImage();
  }
});

// ── upload ───────────────────────────────────────────────
async function uploadImage() {
  const file = FILE_INPUT.files[0];
  if (!file) return;
  setBusy(true, 'Analyzing…');
  // reset compare state
  comparingOriginal = false;
  originalPreviewUrl = null;
  currentPreviewUrl = null;
  COMPARE_BTN.disabled = true;
  DOWNLOAD_BTN.disabled = true;
  COMPARE_BTN.classList.remove('active');

  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    sessionId = data.session_id;
    originalPreviewUrl = data.preview_url;
    currentPreviewUrl  = data.preview_url;
    updatePreview(data.preview_url, data.palette_strip_url, data.palette);
    COMPARE_BTN.disabled = false;
    DOWNLOAD_BTN.disabled = false;
    sysMsg(file.name + ' — ' + data.palette.palette.length + ' colors extracted');
    TEXTAREA.disabled = false; SEND_REAL.disabled = false;
    HINT.textContent = 'What would you like to change?';
    TEXTAREA.focus();
  } catch (err) {
    sysMsg('Upload failed: ' + err.message);
    HINT.textContent = '';
  } finally { setBusy(false); }
}

// ── send ─────────────────────────────────────────────────
function sendPrompt() {
  if (busy) { stopStream(); return; }
  const text = TEXTAREA.value.trim();
  if (!text || !sessionId) return;
  TEXTAREA.value = ''; TEXTAREA.style.height = '';
  addMsg('user', text);
  showTyping();
  setBusy(true, 'Waiting for model…');
  stream(text);
}

function stopStream() {
  if (activeSrc) { activeSrc.close(); activeSrc = null; }
  removeTyping();
  setBusy(false);
  HINT.textContent = '';
  sysMsg('Stopped.');
}

// ── SSE ──────────────────────────────────────────────────
const TOOL_LABELS = {
  get_palette:     'view palette',
  update_color:    'set color',
  adjust_color:    'adjust color',
  adjust_palette:  'adjust palette',
  set_lightness:   'set lightness',
  set_chroma:      'set chroma',
  match_lightness: 'match lightness',
  rate_palette:    'rate harmony',
  relabel_color:   'relabel',
  finalize:        'finalize',
  // legacy
  adjust_hsl:      'adjust HSL',
};

function stream(prompt) {
  const url = `/stream/${sessionId}?prompt=${encodeURIComponent(prompt)}&think=${thinkMode}`;
  const src = new EventSource(url);
  activeSrc = src;

  let firstEvent = true;
  function onFirstEvent() {
    if (!firstEvent) return;
    firstEvent = false;
    removeTyping();
    STATUS_BAR.innerHTML = ''; STATUS_BAR.className = 'status-bar';
  }

  src.addEventListener('message', e => {
    onFirstEvent();
    try { const d = JSON.parse(e.data); if (d.text) addMsg('assistant', d.text); } catch(_) {}
  });

  let thinkRow = null, thinkEl = null;

  src.addEventListener('thinking', e => {
    onFirstEvent();
    const { chunk } = JSON.parse(e.data);
    if (!chunk) return;
    if (!thinkEl) {
      thinkRow = document.createElement('div');
      thinkRow.className = 'think-row';
      thinkEl = document.createElement('details');
      thinkEl.className = 'think streaming';
      thinkEl.open = false;
      thinkEl.innerHTML =
        '<summary><span class="arr">▶</span> Thinking…</summary>' +
        '<div class="think-body"></div>';
      thinkRow.appendChild(thinkEl);
      MESSAGES.appendChild(thinkRow);
    }
    thinkEl.querySelector('.think-body').textContent += chunk;
    scrollDown();
  });

  function sealThink() {
    if (thinkEl) {
      thinkEl.classList.remove('streaming');
      thinkEl.querySelector('summary').innerHTML = '<span class="arr">▶</span> Thinking';
    }
    thinkRow = thinkEl = null;
  }

  src.addEventListener('tool_call', e => {
    onFirstEvent();
    sealThink();
    const { name } = JSON.parse(e.data);
    const label = TOOL_LABELS[name] || name;
    const isHarmony = name === 'rate_palette';
    const row = document.createElement('div');
    row.className = 'tool-row';
    row.innerHTML = `<span class="${isHarmony ? 'harmony-chip' : 'tool-chip'}"><span>${esc(label)}</span></span>`;
    MESSAGES.appendChild(row);
    scrollDown();
  });

  src.addEventListener('preview', e => {
    const d = JSON.parse(e.data);
    // update current (recolored) preview
    if (d.preview_url) currentPreviewUrl = d.preview_url;
    // only swap visible image if we're showing recolored (not comparing)
    if (!comparingOriginal) updatePreview(d.preview_url, d.palette_strip_url, d.palette);
    else if (d.palette) updatePaletteOnly(d.palette);
  });

  src.addEventListener('finalize', e => {
    const { reasoning } = JSON.parse(e.data);
    addMsg('assistant', '✓ ' + reasoning);
  });

  src.addEventListener('done', () => {
    removeTyping(); sealThink();
    src.close(); activeSrc = null;
    setBusy(false); HINT.textContent = ''; TEXTAREA.focus();
  });

  src.addEventListener('error', e => {
    removeTyping();
    try { addMsg('system', 'Error: ' + JSON.parse(e.data).error); } catch(_) {}
    sealThink(); src.close(); activeSrc = null; setBusy(false); HINT.textContent = '';
  });

  src.onerror = () => {
    removeTyping(); sealThink();
    src.close(); activeSrc = null; setBusy(false); HINT.textContent = '';
  };
}

// ── preview helpers ───────────────────────────────────────
function setPreviewImg(url, fade = true) {
  if (!url) return;
  if (fade) {
    PREVIEW_IMG.classList.add('fading');
    setTimeout(() => {
      PREVIEW_IMG.src = url;
      PREVIEW_IMG.classList.remove('fading');
    }, 200);
  } else {
    PREVIEW_IMG.src = url;
  }
}

function updatePreview(previewUrl, stripUrl, palette) {
  if (previewUrl) {
    setPreviewImg(previewUrl, !!PREVIEW_IMG.src && PREVIEW_IMG.style.display !== 'none');
    PREVIEW_IMG.style.display = 'block';
    PLACEHOLDER.style.display = 'none';
  }
  if (stripUrl) { PALETTE_STRIP.style.display = 'block'; PALETTE_IMG.src = stripUrl; }
  if (palette)  updatePaletteOnly(palette);
}

function updatePaletteOnly(palette) {
  PALETTE_HDR.style.display = 'flex';
  PALETTE_CARDS.style.display = 'flex';

  // Update harmony badge
  const score = palette.harmony_score ?? 0;
  const interp = score > 0.2 ? 'good' : score > -0.2 ? 'neutral' : 'low';
  HARMONY_DOT.className = 'harmony-dot ' + interp;
  HARMONY_LBL.textContent = 'Harmony ' + (score >= 0 ? '+' : '') + score.toFixed(3);

  // Render color cards
  PALETTE_CARDS.innerHTML = palette.palette.map(c => {
    const oklab = c.oklab || [0, 0, 0];
    const L = oklab[0] ?? 0;
    const chroma = c.chroma ?? 0;
    const hueAngle = c.hue_angle ?? 0;
    const Lpct = Math.round(L * 100);
    // Chroma bar: max chroma ~0.4, scale to %
    const Cpct = Math.min(100, Math.round(chroma / 0.4 * 100));
    // Pick bar fill color based on hue angle for visual flair
    const hue = Math.round(hueAngle);

    return `<div class="color-card">
      <div class="cc-swatch" style="background:${c.hex};border-color:rgba(255,255,255,${L > 0.6 ? '.15' : '.08'})"></div>
      <div class="cc-info">
        <div class="cc-top">
          <span class="cc-label" title="${esc(c.label)}">${esc(c.label)}</span>
          <span class="cc-hex">${esc(c.hex)}</span>
          <span class="cc-pct">${c.pixel_percent}%</span>
        </div>
        <div class="cc-bars">
          <div class="cc-bar-group">
            <span class="cc-bar-lbl">L</span>
            <div class="cc-bar"><div class="cc-bar-fill" style="width:${Lpct}%;background:linear-gradient(90deg,${c.hex}99,${c.hex})"></div></div>
            <span class="cc-bar-val">${L.toFixed(2)}</span>
          </div>
          <span class="cc-chroma" title="chroma ${chroma.toFixed(3)}, hue ${hueAngle}°">C ${chroma.toFixed(2)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── message helpers ───────────────────────────────────────
function addMsg(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  if (role === 'system') {
    row.innerHTML = `<div class="bub">${esc(text)}</div>`;
  } else {
    const avTxt = role === 'user' ? 'You' : 'A';
    row.innerHTML = `<div class="av">${avTxt}</div><div class="bub">${esc(text)}</div>`;
  }
  MESSAGES.appendChild(row);
  scrollDown();
}

function sysMsg(text) { addMsg('system', text); }
function scrollDown() { MESSAGES.parentElement.scrollTop = MESSAGES.parentElement.scrollHeight; }

function setBusy(v, msg) {
  busy = v;
  UPLOAD_BTN.disabled = v;
  TEXTAREA.disabled = v || !sessionId;
  PROMPT_INPUT.disabled = v || !sessionId;
  if (v) {
    SEND_REAL.classList.add('stop'); SEND_REAL.disabled = false;
    SEND_REAL.title = 'Stop';
    ICON_SEND.style.display = 'none'; ICON_STOP.style.display = '';
  } else {
    SEND_REAL.classList.remove('stop'); SEND_REAL.disabled = !sessionId;
    SEND_REAL.title = 'Send (Enter)';
    ICON_SEND.style.display = ''; ICON_STOP.style.display = 'none';
  }
  if (v && msg) {
    STATUS_BAR.innerHTML = `<div class="spinner"></div>${esc(msg)}`;
    STATUS_BAR.className = 'status-bar on';
  } else {
    STATUS_BAR.innerHTML = ''; STATUS_BAR.className = 'status-bar';
  }
}

// ── typing indicator ──────────────────────────────────────
function showTyping() {
  if (typingRow) return;
  typingRow = document.createElement('div');
  typingRow.className = 'typing-row';
  typingRow.innerHTML =
    '<div class="av">A</div>' +
    '<div class="typing-dots"><span></span><span></span><span></span></div>';
  MESSAGES.appendChild(typingRow);
  scrollDown();
}
function removeTyping() {
  if (typingRow) { typingRow.remove(); typingRow = null; }
}


function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── model status ──────────────────────────────────────────
const MODEL_DOT = document.getElementById('modelDot');
const MODEL_LBL = document.getElementById('modelLbl');

let modelLoaded = false;
let modelPollInterval = null;

function setModelState(state, label, title) {
  const colors = { ready: '#6ab187', loading: '#e0a020', offline: '#c0392b', unknown: 'var(--text-dim)' };
  MODEL_DOT.style.background = colors[state] || colors.unknown;
  MODEL_LBL.textContent = label;
  MODEL_LBL.title = title || '';
  // pulse animation while loading
  MODEL_DOT.style.animation = state === 'loading' ? 'pulse 1.2s ease-in-out infinite' : 'none';
}

async function checkModelStatus() {
  try {
    const r = await fetch('/model-status');
    const d = await r.json();
    if (d.loaded) {
      modelLoaded = true;
      setModelState('ready', 'Model ready', d.model + ' is in VRAM');
      // slow down polling once loaded
      if (modelPollInterval) { clearInterval(modelPollInterval); modelPollInterval = setInterval(checkModelStatus, 20000); }
    } else {
      setModelState('loading', 'Model loading…', 'Loading ' + d.model + ' into VRAM');
    }
  } catch(_) {
    setModelState('offline', 'Ollama offline', 'Cannot reach Ollama at localhost:11434');
    if (modelPollInterval) { clearInterval(modelPollInterval); modelPollInterval = setInterval(checkModelStatus, 20000); }
  }
}

async function startPreload() {
  try {
    const r = await fetch('/model-status');
    const d = await r.json();
    if (d.loaded) {
      modelLoaded = true;
      setModelState('ready', 'Model ready', d.model + ' is in VRAM');
      modelPollInterval = setInterval(checkModelStatus, 20000);
    } else {
      // trigger preload, then poll fast until loaded
      setModelState('loading', 'Model loading…', 'Warming up model — ready in ~30s');
      fetch('/preload', { method: 'POST' }).catch(() => {});
      modelPollInterval = setInterval(checkModelStatus, 3000);
    }
  } catch(_) {
    setModelState('offline', 'Ollama offline', 'Cannot reach Ollama at localhost:11434');
    modelPollInterval = setInterval(checkModelStatus, 20000);
  }
}

startPreload();
</script>
</body>
</html>
